<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Heart Vortex Particle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <script>
    /* ========================================================
       1. SYNTH AUDIO: SUB-BASS WOOSH & 808 EXPLOSION
       ======================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    ['touchstart', 'mousedown', 'pointerdown'].forEach(ev => {
      window.addEventListener(ev, ensureAudio, { once: true, passive: true });
    });

    // Suara putaran pusaran yang tersedot ke atas
    function playVortexRiseSound() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(30, t);
      osc.frequency.exponentialRampToValueAtTime(110, t + 1.4);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(50, t);
      filter.frequency.exponentialRampToValueAtTime(260, t + 1.4);

      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.35, t + 0.9);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.8);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + 1.8);
    }

    // Suara ledakan sub-bass bioskop saat diketuk
    function playBassBlast() {
      ensureAudio();
      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, t);
      osc.frequency.exponentialRampToValueAtTime(22, t + 1.1);

      gain.gain.setValueAtTime(0.9, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.2);

      // Shimmer sweep
      const bufSize = audioCtx.sampleRate * 0.6;
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, t);
      filter.Q.setValueAtTime(3, t);

      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.3, t);
      nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);

      noise.connect(filter);
      filter.connect(nGain);
      nGain.connect(audioCtx.destination);

      noise.start(t);
      noise.stop(t + 0.6);
    }

    /* ========================================================
       2. PARTIKEL DENGAN WARNA GELAP & ALUR PUSARAN KE HATI
       ======================================================== */
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Palet warna biru pekat dan gelap sesuai video asli
    const DEEP_BLUES = [
      '#0f172a', // deep navy
      '#1e293b', // slate dark
      '#1d4ed8', // deep royal blue
      '#2563eb', // sapphire blue
      '#0284c7', // electric ocean
      '#38bdf8'  // edge highlight
    ];

    function getHeartPoint(t, scale = 14) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    const TOTAL_PARTICLES = 1100;
    const particles = [];
    const burstParticles = [];

    class MorphParticle {
      constructor() {
        this.color = DEEP_BLUES[Math.floor(Math.random() * DEEP_BLUES.length)];
        this.size = Math.random() * 2.0 + 0.7;

        // Parameter saat fase pusaran bawah
        this.vortexAngle = Math.random() * Math.PI * 2;
        this.vortexRadius = Math.random() * 95 + 10;
        this.vortexSpeed = Math.random() * 0.07 + 0.03;
        this.vortexYOffset = (Math.random() - 0.5) * 12;

        // Parameter saat fase bentuk hati
        this.heartT = Math.random() * Math.PI * 2;
        const isRim = Math.random() > 0.35;
        const s = isRim ? (1 + (Math.random() - 0.5) * 0.08) : Math.sqrt(Math.random()) * 0.95;
        const hp = getHeartPoint(this.heartT, 14.5 * s);
        this.heartX = hp.x;
        this.heartY = hp.y;

        // Posisi & status
        this.x = width / 2;
        this.y = height * 0.78;
        this.scatterX = 0;
        this.scatterY = 0;
      }

      update(stateProgress, beat) {
        const cx = width / 2;
        const cyBottom = height * 0.78;
        const cyHeart = height / 2 - 25;

        // Posisi di pusaran bawah
        this.vortexAngle += this.vortexSpeed;
        const vx = cx + Math.cos(this.vortexAngle) * (this.vortexRadius * 1.4);
        const vy = cyBottom + Math.sin(this.vortexAngle) * (this.vortexRadius * 0.3) + this.vortexYOffset;

        // Posisi di hati atas
        const hx = cx + (this.heartX * beat);
        const hy = cyHeart + (this.heartY * beat);

        // Interpolasi perpindahan dari pusaran bawah (0) ke hati (1)
        const targetX = vx + (hx - vx) * stateProgress + this.scatterX;
        const targetY = vy + (hy - vy) * stateProgress + this.scatterY;

        this.x += (targetX - this.x) * 0.08;
        this.y += (targetY - this.y) * 0.08;

        this.scatterX *= 0.92;
        this.scatterY *= 0.92;
      }

      draw(c) {
        c.fillStyle = this.color;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
      }
    }

    for (let i = 0; i < TOTAL_PARTICLES; i++) {
      particles.push(new MorphParticle());
    }

    /* ========================================================
       3. SIKLUS: PUSARAN BAWAH -> MENGUMPUL JADI HATI
       ======================================================== */
    let animTime = 0;
    let cyclePhase = 0; // 0 = berputar di bawah, 1 = naik menyatu jadi hati
    let morphProgress = 0;

    function cycleManager() {
      if (cyclePhase === 0) {
        playVortexRiseSound();
        // Berputar di bawah selama 2.5 detik lalu melesat naik
        setTimeout(() => {
          cyclePhase = 1;
        }, 2200);
      }
    }
    cycleManager();

    function render() {
      animTime += 0.035;

      // Latar belakang hitam murni dengan jejak redup halus
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.fillRect(0, 0, width, height);

      // Transisi progress gerak (0 ke 1)
      if (cyclePhase === 1 && morphProgress < 1) {
        morphProgress += 0.015;
        if (morphProgress > 1) morphProgress = 1;
      }

      // Cahaya dasar biru gelap (Deep Midnight Pedestal)
      ctx.globalCompositeOperation = 'lighter';
      const cx = width / 2;
      const cyBottom = height * 0.78;

      const darkGlow = ctx.createRadialGradient(cx, cyBottom, 4, cx, cyBottom, 120);
      darkGlow.addColorStop(0, 'rgba(29, 78, 216, 0.45)');  // Deep royal blue
      darkGlow.addColorStop(0.4, 'rgba(15, 23, 42, 0.35)'); // Navy gelap
      darkGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = darkGlow;
      ctx.beginPath();
      ctx.ellipse(cx, cyBottom, 130, 32, 0, 0, Math.PI * 2);
      ctx.fill();

      // Denyut halus saat sudah berbentuk hati
      const beat = 1 + Math.sin(animTime * 3) * (0.025 * morphProgress);

      // Gambar semua partikel
      for (let i = 0; i < particles.length; i++) {
        particles[i].update(morphProgress, beat);
        particles[i].draw(ctx);
      }

      // Gambar partikel ledakan saat diketuk
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;
        bp.vx *= 0.94;
        bp.vy *= 0.94;
        bp.size *= 0.95;

        ctx.fillStyle = bp.color;
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
        ctx.fill();

        if (bp.size < 0.25) burstParticles.splice(i, 1);
      }

      requestAnimationFrame(render);
    }
    render();

    /* ========================================================
       4. INTERAKSI KETUK (LEDAKAN BASS INSTAN)
       ======================================================== */
    window.addEventListener('pointerdown', () => {
      playBassBlast();

      const cx = width / 2;
      const cyHeart = height / 2 - 25;

      // Hamburkan partikel ledakan tambahan
      for (let i = 0; i < 160; i++) {
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 16 + 4;
        burstParticles.push({
          x: cx,
          y: cyHeart,
          vx: Math.cos(angle) * force,
          vy: Math.sin(angle) * force,
          size: Math.random() * 3 + 1,
          color: DEEP_BLUES[Math.floor(Math.random() * DEEP_BLUES.length)]
        });
      }

      // Partikel hati terpental luas lalu perlahan menyatu kembali
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const angle = Math.atan2(p.y - cyHeart, p.x - cx) + (Math.random() - 0.5) * 0.4;
        const force = Math.random() * 220 + 90;
        p.scatterX = Math.cos(angle) * force;
        p.scatterY = Math.sin(angle) * force;
      }
    });
  </script>
</body>
</html>
