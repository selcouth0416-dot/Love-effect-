<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Particle Burst</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #000; height: 100%; width: 100%;
  }
  canvas { display: block; touch-action: none; }
  #startOverlay {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    color: #bfdbfe; font-family: sans-serif; font-size: 14px;
    background: rgba(30,58,138,0.35); padding: 10px 18px; border-radius: 30px;
    border: 1px solid rgba(147,197,253,0.4);
    cursor: pointer; z-index: 10; transition: opacity 0.4s;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="startOverlay">🔊 Tap untuk mengaktifkan suara</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

// kalau kamu punya file suara sendiri (legal/milik sendiri), isi path-nya di sini, mis: "heartbeat.mp3"
const CUSTOM_AUDIO_URL = "";

const BLUE_SHADES = ["#3b82f6", "#60a5fa", "#93c5fd", "#2563eb", "#bfdbfe", "#1d4ed8"];
function randomColor(){ return BLUE_SHADES[Math.floor(Math.random()*BLUE_SHADES.length)]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

let heartCenterX, heartCenterY, heartScale, poolX, poolY;
let glowCanvas, glowCtx;
const GLOW_SCALE = 0.28;

function setupHeartPosition(){
  heartCenterX = width/2;
  heartCenterY = height*0.4;
  heartScale = Math.min(width,height)*0.017;
  poolX = width/2;
  poolY = height*0.74;
}
function resize(){
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  glowCanvas.width = Math.max(1, Math.floor(width*GLOW_SCALE));
  glowCanvas.height = Math.max(1, Math.floor(height*GLOW_SCALE));
  setupHeartPosition();
}

let RAW_MIN_HY = Infinity, RAW_MAX_HY = -Infinity;
for (let i=0;i<=360;i++){
  const t=(i/360)*Math.PI*2;
  const hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  if(hy<RAW_MIN_HY) RAW_MIN_HY=hy;
  if(hy>RAW_MAX_HY) RAW_MAX_HY=hy;
}

const HEART_COUNT = 170;
const STREAM_COUNT = 20;
const FLOAT_COUNT = 50;
const heartParticles = [];
const streamParticles = [];
const floatParticles = [];

class HeartParticle {
  constructor(){ this.init(true); }
  init(isFirstSpawn){
    const t = Math.random()*Math.PI*2;
    const s = Math.sqrt(Math.random());
    this.hx = 16*Math.pow(Math.sin(t),3);
    this.hy = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    this.s = s;
    const actualHy = this.hy*this.s;
    this.v = clamp((actualHy-RAW_MIN_HY)/(RAW_MAX_HY-RAW_MIN_HY),0,1); // 0=atas 1=bawah

    this.color = randomColor();
    this.size = Math.random()*2+0.8;

    this.x = poolX + (Math.random()-0.5)*20;
    this.y = poolY + (Math.random()-0.5)*8;
    this.vortexAngle = Math.random()*Math.PI*2;
    this.vortexRadius = 16+Math.random()*26;

    this.state = 'settle';
    this.stateTimer = isFirstSpawn ? -Math.floor(Math.random()*220) : 0;
    this.settleDuration = Math.floor((70+Math.random()*30)*(0.75+this.v*0.7));
    this.holdDuration = Math.floor((90+Math.random()*40)*(1-this.v*0.55));
    this.releaseDuration = Math.floor((70+Math.random()*40)*(0.55+this.v*1.15));
    this.trail = [];
    this.alpha = 0;
  }

  update(){
    const tx = this.hx*this.s*heartScale;
    const ty = this.hy*this.s*heartScale;

    this.stateTimer++;
    if (this.stateTimer < 0){
      this.vortexAngle += 0.05;
      this.x = poolX + Math.cos(this.vortexAngle)*this.vortexRadius;
      this.y = poolY + Math.sin(this.vortexAngle)*this.vortexRadius*0.3;
      this.alpha = 0.15;
      return;
    }

    if (this.state === 'settle'){
      const p = Math.min(this.stateTimer/this.settleDuration,1);
      const ease = 1-Math.pow(1-p,3);
      this.vortexAngle += 0.16*(1-ease)+0.02;
      const swirl = (1-ease)*this.vortexRadius*0.55;
      const baseX = poolX + ((heartCenterX+tx)-poolX)*ease;
      const baseY = poolY + ((heartCenterY+ty)-poolY)*ease;
      this.x = baseX + Math.cos(this.vortexAngle)*swirl;
      this.y = baseY + Math.sin(this.vortexAngle)*swirl*0.4;
      this.alpha = 0.2+ease*0.8;
      if (p>=1){ this.state='hold'; this.stateTimer=0; }

    } else if (this.state === 'hold'){
      const tw = this.stateTimer*0.06;
      this.x = heartCenterX+tx + Math.sin(tw+tx)*0.5;
      this.y = heartCenterY+ty + Math.cos(tw+ty)*0.5;
      this.alpha = 0.85+Math.sin(tw*1.3)*0.15;
      if (this.stateTimer >= this.holdDuration){
        this.state='release'; this.stateTimer=0;
        // bias ke bawah: meleleh/menetes, bukan meledak radial
        const angle = Math.PI/2 + (Math.random()-0.5)*2.3;
        const force = 0.8+Math.random()*1.7;
        this.vx = Math.cos(angle)*force;
        this.vy = Math.sin(angle)*force;
        this.trail = [[this.x,this.y]];
      }

    } else if (this.state === 'release'){
      this.trail.push([this.x,this.y]);
      if (this.trail.length>5) this.trail.shift();
      this.vx += (Math.random()-0.5)*0.4;
      this.vy += (Math.random()-0.5)*0.25 + 0.09; // gravitasi menarik ke bawah
      this.vx *= 0.965; this.vy *= 0.99;
      this.x += this.vx; this.y += this.vy;
      const p = Math.min(this.stateTimer/this.releaseDuration,1);
      this.alpha = Math.max(0,1-p);
      if (this.stateTimer >= this.releaseDuration) this.init(false);
    }
  }
}

class StreamParticle {
  constructor(){ this.reset(); }
  reset(){
    this.x = poolX+(Math.random()-0.5)*30;
    this.y = poolY;
    this.vx = (Math.random()-0.5)*0.4;
    this.vy = -(Math.random()*1.4+0.6);
    this.size = Math.random()*1.3+0.4;
    this.color = randomColor();
    this.life = 0;
    this.maxLife = Math.random()*60+40;
  }
  update(){
    this.x += this.vx; this.y += this.vy;
    this.life++;
    this.alpha = (1-(this.life/this.maxLife))*0.7;
    if (this.life>=this.maxLife || this.y < heartCenterY) this.reset();
  }
}

class FloatParticle {
  constructor(){ this.reset(true); }
  reset(first){
    this.x = Math.random()*width;
    this.y = first ? Math.random()*height : height+Math.random()*40;
    this.vx = (Math.random()-0.5)*0.25;
    this.vy = -(Math.random()*0.5+0.15);
    this.size = Math.random()*1.4+0.4;
    this.color = randomColor();
    this.twinklePhase = Math.random()*Math.PI*2;
    this.twinkleSpeed = Math.random()*0.04+0.015;
  }
  update(){
    this.x += this.vx; this.y += this.vy;
    this.twinklePhase += this.twinkleSpeed;
    this.alpha = Math.sin(this.twinklePhase)*0.35+0.45;
    if (this.y < -10) this.reset(false);
  }
}

function drawGlowPool(frame){
  const t = frame*0.02;
  const pulse = Math.sin(t)*0.15+0.85;
  const grad = ctx.createRadialGradient(poolX,poolY,0,poolX,poolY,95*pulse);
  grad.addColorStop(0,"rgba(191,219,254,0.9)");
  grad.addColorStop(0.4,"rgba(59,130,246,0.5)");
  grad.addColorStop(1,"rgba(59,130,246,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(poolX,poolY,72*pulse,20*pulse,0,0,Math.PI*2);
  ctx.fill();
  for (let i=0;i<2;i++){
    const off = Math.sin(t*1.5+i*2)*14;
    ctx.strokeStyle = "rgba(219,234,254,0.5)";
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.ellipse(poolX+off,poolY+Math.cos(t+i)*3,54-i*10,8-i*2,0,0,Math.PI*2);
    ctx.stroke();
  }
}

// render murah: gambar kecil di canvas offscreen lalu di-upscale (jadi "blur" gratis, tanpa shadowBlur)
function drawGlowPass(list, sizeMult){
  for (const p of list){
    if (p.alpha<=0) continue;
    glowCtx.globalAlpha = p.alpha;
    glowCtx.fillStyle = p.color;
    glowCtx.beginPath();
    glowCtx.arc(p.x*GLOW_SCALE, p.y*GLOW_SCALE, Math.max(0.6,p.size*sizeMult*GLOW_SCALE), 0, Math.PI*2);
    glowCtx.fill();
  }
}
function drawSharpPass(list, sizeMult){
  for (const p of list){
    if (p.alpha<=0) continue;
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*sizeMult*0.55, 0, Math.PI*2);
    ctx.fill();
  }
}
function drawHeartTrails(){
  ctx.lineCap = 'round';
  for (const p of heartParticles){
    if (p.state!=='release' || p.trail.length<2) continue;
    for (let i=1;i<p.trail.length;i++){
      ctx.globalAlpha = (i/p.trail.length)*p.alpha*0.7;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size*0.7;
      ctx.beginPath();
      ctx.moveTo(p.trail[i-1][0], p.trail[i-1][1]);
      ctx.lineTo(p.trail[i][0], p.trail[i][1]);
      ctx.stroke();
    }
  }
}

// ---------- AUDIO: bass "heartbeat" hasil analisis gelombang video asli (~1.15s/ketuk, fokus 80-200Hz) ----------
let audioCtx=null, masterGain=null, convolver=null, audioStarted=false;
let padOsc1, padOsc2, padGain;
let heartbeatTimer = 0;
const HEARTBEAT_INTERVAL = 69; // ~1.15 detik @60fps
let customAudioEl = null;

function buildReverbImpulse(ctx,duration=1.8,decay=2.6){
  const rate=ctx.sampleRate, length=Math.floor(rate*duration);
  const impulse=ctx.createBuffer(2,length,rate);
  for (let ch=0; ch<2; ch++){
    const data=impulse.getChannelData(ch);
    for (let i=0;i<length;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/length,decay);
  }
  return impulse;
}
function routeSound(node,dryAmt,wetAmt){
  const dry=audioCtx.createGain(); dry.gain.value=dryAmt;
  const wet=audioCtx.createGain(); wet.gain.value=wetAmt;
  node.connect(dry); dry.connect(masterGain);
  node.connect(wet); wet.connect(convolver);
}

function initAudio(){
  if (audioStarted) return;
  audioStarted = true;

  if (CUSTOM_AUDIO_URL){
    customAudioEl = new Audio(CUSTOM_AUDIO_URL);
    customAudioEl.loop = true;
    customAudioEl.volume = 0.9;
    customAudioEl.play().catch(()=>{});
    return;
  }

  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.9;
  masterGain.connect(audioCtx.destination);

  convolver = audioCtx.createConvolver();
  convolver.buffer = buildReverbImpulse(audioCtx);
  convolver.connect(masterGain);

  padOsc1 = audioCtx.createOscillator(); padOsc1.type='sine'; padOsc1.frequency.value=110;
  padOsc2 = audioCtx.createOscillator(); padOsc2.type='sine'; padOsc2.frequency.value=164.8;
  padGain = audioCtx.createGain(); padGain.gain.value=0.035;
  padOsc1.connect(padGain); padOsc2.connect(padGain); padGain.connect(masterGain);
  padOsc1.start(); padOsc2.start();

  const lfo=audioCtx.createOscillator(); lfo.frequency.value=0.12;
  const lfoGain=audioCtx.createGain(); lfoGain.gain.value=0.02;
  lfo.connect(lfoGain); lfoGain.connect(padGain.gain);
  lfo.start();

  if (audioCtx.state==='suspended') audioCtx.resume();
  heartbeatTimer = HEARTBEAT_INTERVAL-20;
}

function playHeartbeatHit(){
  if (!audioCtx) return;
  const t0=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  osc.type='sine';
  osc.frequency.setValueAtTime(130,t0);
  osc.frequency.exponentialRampToValueAtTime(85,t0+0.09);
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(1.0,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+0.65);
  osc.connect(g); routeSound(g,0.85,0.55);
  osc.start(t0); osc.stop(t0+0.7);

  const nb=audioCtx.createBuffer(1,audioCtx.sampleRate*0.03,audioCtx.sampleRate);
  const nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nd.length,1.5);
  const noise=audioCtx.createBufferSource(); noise.buffer=nb;
  const nf=audioCtx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=500;
  const ng=audioCtx.createGain(); ng.gain.value=0.4;
  noise.connect(nf); nf.connect(ng); routeSound(ng,0.7,0.4);
  noise.start(t0);
}

function updateHeartbeat(){
  if (!audioStarted || customAudioEl) return;
  heartbeatTimer++;
  if (heartbeatTimer>=HEARTBEAT_INTERVAL){
    heartbeatTimer=0;
    playHeartbeatHit();
  }
}

const overlay = document.getElementById('startOverlay');
overlay.addEventListener('click', ()=>{
  initAudio();
  overlay.style.opacity='0';
  setTimeout(()=>overlay.style.display='none',400);
});

// ---------- MAIN LOOP ----------
glowCanvas = document.createElement('canvas');
glowCtx = glowCanvas.getContext('2d');
resize();
window.addEventListener('resize', resize);

for (let i=0;i<HEART_COUNT;i++) heartParticles.push(new HeartParticle());
for (let i=0;i<STREAM_COUNT;i++) streamParticles.push(new StreamParticle());
for (let i=0;i<FLOAT_COUNT;i++) floatParticles.push(new FloatParticle());

let frameCount = 0;
function animate(){
  frameCount++;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0,0,width,height);

  for (const p of floatParticles) p.update();
  for (const p of streamParticles) p.update();
  for (const p of heartParticles) p.update();

  glowCtx.clearRect(0,0,glowCanvas.width,glowCanvas.height);
  glowCtx.globalCompositeOperation = 'lighter';
  drawGlowPass(floatParticles, 1.6);
  drawGlowPass(streamParticles, 1.6);
  drawGlowPass(heartParticles, 1.8);

  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 1;
  ctx.drawImage(glowCanvas, 0, 0, glowCanvas.width, glowCanvas.height, 0, 0, width, height);

  drawGlowPool(frameCount);
  drawSharpPass(floatParticles, 1);
  drawSharpPass(streamParticles, 1);
  drawSharpPass(heartParticles, 1);
  drawHeartTrails();

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  updateHeartbeat();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
