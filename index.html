<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Heart Spiral Swirl - 100% Exact</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <script>
    /* ========================================================
       1. SYNTH AUDIO: SUB-BASS WOOSH & MEWAH
       ======================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    ['touchstart', 'mousedown', 'pointerdown'].forEach(ev => {
      window.addEventListener(ev, ensureAudio, { once: true, passive: true });
    });

    // Suara spiral naik melilit (whoosh bernada bass empuk)
    function playSpiralSwirlSound() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(45, t);
      osc.frequency.exponentialRampToValueAtTime(140, t + 1.2);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(80, t);
      filter.frequency.exponentialRampToValueAtTime(450, t + 1.2);

      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.4, t + 0.6);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.4);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + 1.4);
    }

    // Suara ledakan sub-bass bioskop saat diketuk
    function playBassExplosion() {
      ensureAudio();
      const t = audioCtx.currentTime;

      // Sub-drop 180Hz -> 20Hz
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(20, t + 1.3);

      gain.gain.setValueAtTime(1.0, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.35);

      // Shimmer sparkle blast
      const bufSize = audioCtx.sampleRate * 0.6;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1500, t);
      filter.Q.setValueAtTime(3, t);

      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.4, t);
      nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);

      noise.connect(filter);
      filter.connect(nGain);
      nGain.connect(audioCtx.destination);

      noise.start(t);
      noise.stop(t + 0.6);
    }

    /* ========================================================
       2. REPLIKA PERSIS: HATI, CINCIN PEDESTAL, & SPIRAL MELILIT
       ======================================================== */
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Warna titik hati persis video: dominan biru tua royal, aksen cyan terang & putih
    const HEART_COLORS = [
      '#ffffff',
      '#7dd3fc',
      '#38bdf8',
      '#0284c7',
      '#2563eb',
      '#1d4ed8',
      '#1e40af'
    ];

    // Fungsi bentuk hati matematis
    function getHeartPoint(t, scale = 14.5) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    /* --- A. Partikel Hati (Stardust) --- */
    const HEART_POINTS_COUNT = 1500;
    const heartParticles = [];

    for (let i = 0; i < HEART_POINTS_COUNT; i++) {
      const t = Math.random() * Math.PI * 2;
      // Kerapatan tepi luar lebih padat
      const isRim = Math.random() > 0.35;
      const s = isRim ? (1 + (Math.random() - 0.5) * 0.09) : Math.sqrt(Math.random()) * 0.98;
      const pt = getHeartPoint(t, 15 * s);

      heartParticles.push({
        baseX: pt.x,
        baseY: pt.y,
        x: width / 2 + pt.x,
        y: height / 2 - 40 + pt.y,
        size: Math.random() * 1.8 + 0.6,
        color: HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)],
        shimmerSpeed: Math.random() * 0.08 + 0.02,
        shimmerVal: Math.random() * Math.PI * 2,
        scatterX: 0,
        scatterY: 0
      });
    }

    /* --- B. Garis Spiral Melesat Melilit (Garis Muter Sesuai Detik 00:04) --- */
    const SWIRL_COUNT = 14;
    const swirlLines = [];

    for (let i = 0; i < SWIRL_COUNT; i++) {
      swirlLines.push({
        progress: Math.random(), // 0 (bawah) -> 1 (atas)
        speed: Math.random() * 0.008 + 0.006,
        angleOffset: Math.random() * Math.PI * 2,
        turns: Math.random() * 3 + 2.5,
        radiusBase: Math.random() * 50 + 60,
        trail: [] // riwayat koordinat untuk ekor garis meliuk
      });
    }

    /* --- C. Partikel Ledakan Tambahan --- */
    const burstParticles = [];

    /* ========================================================
       3. ANIMATION LOOP
       ======================================================== */
    let animTime = 0;

    function render() {
      animTime += 0.035;

      // Jejak gerak gelap transparan
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cyHeart = height / 2 - 40;
      const cyBase = height * 0.82;

      // Mode neon bersinar murni
      ctx.globalCompositeOperation = 'lighter';

      /* --------------------------------------------------------
         1. CINCIN PORTAL CYAN TERANG DI BAWAH (PERSIS VIDEO)
         -------------------------------------------------------- */
      // Pendaran kabut cyan bawah
      const baseGlow = ctx.createRadialGradient(cx, cyBase, 6, cx, cyBase, 120);
      baseGlow.addColorStop(0, 'rgba(0, 240, 255, 0.85)');
      baseGlow.addColorStop(0.25, 'rgba(2, 132, 199, 0.6)');
      baseGlow.addColorStop(0.6, 'rgba(37, 99, 235, 0.2)');
      baseGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = baseGlow;
      ctx.beginPath();
      ctx.ellipse(cx, cyBase, 125, 26, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cincin laser berputar di tepi pendaran
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(cx, cyBase, 110 + Math.sin(animTime * 3) * 3, 20, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Cincin dalam putih menyala
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(cx, cyBase, 85, 14, 0, 0, Math.PI * 2);
      ctx.stroke();

      /* --------------------------------------------------------
         2. GARIS-GARIS SPIRAL MELILIT NAIK (PERSIS DETIK 00:04)
         -------------------------------------------------------- */
      for (let i = 0; i < swirlLines.length; i++) {
        const sw = swirlLines[i];
        sw.progress += sw.speed;
        if (sw.progress > 1) {
          sw.progress = 0;
          sw.trail = [];
        }

        // Posisi Y dari cincin bawah menuju atas hati
        const curY = cyBase - sw.progress * (cyBase - (cyHeart - 120));
        // Radius menyempit di bawah lalu melebar di badan hati
        const rFactor = Math.sin(sw.progress * Math.PI);
        const curRadius = sw.radiusBase * (0.4 + rFactor * 1.6);
        const curAngle = sw.angleOffset + sw.progress * (sw.turns * Math.PI * 2);

        const px = cx + Math.cos(curAngle) * curRadius;
        const py = curY + Math.sin(curAngle) * (curRadius * 0.28);

        sw.trail.push({ x: px, y: py });
        if (sw.trail.length > 18) sw.trail.shift();

        // Gambar ekor garis meliuk
        if (sw.trail.length > 2) {
          ctx.beginPath();
          ctx.moveTo(sw.trail[0].x, sw.trail[0].y);
          for (let j = 1; j < sw.trail.length; j++) {
            ctx.lineTo(sw.trail[j].x, sw.trail[j].y);
          }
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.75)';
          ctx.lineWidth = 2.2;
          ctx.stroke();

          // Kepala cahaya terang
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(px, py, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      /* --------------------------------------------------------
         3. TITIK-TITIK BINTANG HATI (PERSIS VIDEO)
         -------------------------------------------------------- */
      const heartBeat = 1 + Math.sin(animTime * 2.8) * 0.025;

      for (let i = 0; i < heartParticles.length; i++) {
        const p = heartParticles[i];
        p.shimmerVal += p.shimmerSpeed;

        const targetX = cx + (p.baseX * heartBeat) + p.scatterX;
        const targetY = cyHeart + (p.baseY * heartBeat) + p.scatterY;

        p.x += (targetX - p.x) * 0.08;
        p.y += (targetY - p.y) * 0.08;

        p.scatterX *= 0.92;
        p.scatterY *= 0.92;

        const alpha = 0.5 + Math.sin(p.shimmerVal) * 0.5;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      /* --------------------------------------------------------
         4. PARTIKEL LEDAKAN SAAT DIKETUK
         -------------------------------------------------------- */
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;
        bp.vx *= 0.94;
        bp.vy *= 0.94;
        bp.size *= 0.95;

        ctx.fillStyle = bp.color;
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
        ctx.fill();

        if (bp.size < 0.2) burstParticles.splice(i, 1);
      }

      requestAnimationFrame(render);
    }
    render();

    // Suara whoosh berkala sinkron dengan naiknya spiral
    setInterval(() => {
      if (audioCtx) playSpiralSwirlSound();
    }, 4500);

    /* ========================================================
       4. INTERAKSI KETUK
       ======================================================== */
    window.addEventListener('pointerdown', (e) => {
      playBassExplosion();

      const cx = width / 2;
      const cyHeart = height / 2 - 40;

      // Hamburan partikel ledakan
      for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 18 + 5;
        burstParticles.push({
          x: cx,
          y: cyHeart,
          vx: Math.cos(angle) * force,
          vy: Math.sin(angle) * force,
          size: Math.random() * 3.5 + 1.2,
          color: HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)]
        });
      }

      // Partikel hati terpental lalu ditarik kembali
      for (let i = 0; i < heartParticles.length; i++) {
        const p = heartParticles[i];
        const angle = Math.atan2(p.y - cyHeart, p.x - cx) + (Math.random() - 0.5) * 0.4;
        const force = Math.random() * 260 + 110;
        p.scatterX = Math.cos(angle) * force;
        p.scatterY = Math.sin(angle) * force;
      }
    });
  </script>
</body>
</html>
