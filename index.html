<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Luxury Particle Heart 3D</title>
  <meta name="description" content="3D Glowing Multi-Chromatic Particle Heart with Deep Bass Audio FX" />
  
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
    }

    /* Petunjuk Ketukan Sangat Halus di Bawah (Akan hilang perlahan) */
    .hint-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 120, 180, 0.7);
      font-family: monospace;
      animation: pulseText 2.5s infinite ease-in-out;
      z-index: 10;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(0.98); }
      50% { opacity: 0.85; transform: translateX(-50%) scale(1.02); }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="hint-overlay" id="hint">✦ Ketuk Layar untuk Memutar & Dentuman Bass ✦</div>

  <script>
    // =========================================================================
    // 1. CINEMATIC PROCEDURAL AUDIO SYNTHESIZER (SUPER NGEBAS & MEWAH)
    // =========================================================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.ambientGain = null;
        this.ambientOscs = [];
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      }

      unlock() {
        this.enabled = true;
        const ctx = this.initCtx();
        if (ctx && !this.ambientGain) {
          this.startAmbient();
        }
      }

      // Dentuman Sub-Bass 808 Saat Layar Diketuk / Dipencet
      playTapBassDrop() {
        this.unlock();
        const ctx = this.initCtx();
        if (!ctx) return;
        const now = ctx.currentTime;

        // Sub-bass layer 1: 56Hz meluncur turun ke 24Hz
        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(56, now);
        subOsc.frequency.exponentialRampToValueAtTime(24, now + 0.55);

        subGain.gain.setValueAtTime(0.85, now);
        subGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

        const subFilter = ctx.createBiquadFilter();
        subFilter.type = 'lowpass';
        subFilter.frequency.setValueAtTime(110, now);
        subFilter.frequency.exponentialRampToValueAtTime(45, now + 0.55);

        subOsc.connect(subFilter);
        subFilter.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start(now);
        subOsc.stop(now + 0.65);

        // Punch body layer 2
        const midOsc = ctx.createOscillator();
        const midGain = ctx.createGain();
        midOsc.type = 'triangle';
        midOsc.frequency.setValueAtTime(92, now);
        midOsc.frequency.exponentialRampToValueAtTime(36, now + 0.35);

        midGain.gain.setValueAtTime(0.48, now);
        midGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);

        midOsc.connect(midGain);
        midGain.connect(ctx.destination);
        midOsc.start(now);
        midOsc.stop(now + 0.45);
      }

      // Bass Gemuruh & Putaran Kosmik Saat Berputar (Muter Panjang)
      playVortexSurge() {
        this.unlock();
        const ctx = this.initCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const duration = 7.0;

        // 1. Sub-Bass Drone Riser
        const subDrone = ctx.createOscillator();
        const subGain = ctx.createGain();
        subDrone.type = 'sine';
        subDrone.frequency.setValueAtTime(38, now);
        subDrone.frequency.exponentialRampToValueAtTime(72, now + 2.5);
        subDrone.frequency.exponentialRampToValueAtTime(94, now + 4.8);
        subDrone.frequency.exponentialRampToValueAtTime(32, now + duration);

        subGain.gain.setValueAtTime(0.001, now);
        subGain.gain.linearRampToValueAtTime(0.70, now + 1.2);
        subGain.gain.linearRampToValueAtTime(0.62, now + 4.8);
        subGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        const bassFilter = ctx.createBiquadFilter();
        bassFilter.type = 'lowpass';
        bassFilter.Q.value = 4.2;
        bassFilter.frequency.setValueAtTime(85, now);
        bassFilter.frequency.linearRampToValueAtTime(240, now + 2.8);
        bassFilter.frequency.linearRampToValueAtTime(95, now + duration);

        subDrone.connect(bassFilter);
        bassFilter.connect(subGain);
        subGain.connect(ctx.destination);
        subDrone.start(now);
        subDrone.stop(now + duration);

        // 2. Sapuan Angin Kosmik Stereo
        const bufferSize = Math.floor(ctx.sampleRate * 6.0);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          data[i] = (b0 + b1 + b2) * 0.45;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const noiseFilter = ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.Q.value = 5.0;
        noiseFilter.frequency.setValueAtTime(160, now);
        noiseFilter.frequency.exponentialRampToValueAtTime(1600, now + 2.5);
        noiseFilter.frequency.exponentialRampToValueAtTime(2400, now + 4.2);
        noiseFilter.frequency.exponentialRampToValueAtTime(250, now + 6.0);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.001, now);
        noiseGain.gain.linearRampToValueAtTime(0.40, now + 1.8);
        noiseGain.gain.linearRampToValueAtTime(0.35, now + 4.2);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 6.2);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 6.3);

        // 3. Denting Kristal Mewah (Celestial Chimes)
        const chimeFreqs = [528, 660, 792, 1056, 1320, 1584, 2112];
        chimeFreqs.forEach((freq, idx) => {
          const cTime = now + 1.0 + idx * 0.45;
          const cOsc = ctx.createOscillator();
          const cGain = ctx.createGain();

          cOsc.type = 'sine';
          cOsc.frequency.setValueAtTime(freq, cTime);
          cOsc.frequency.exponentialRampToValueAtTime(freq * 1.25, cTime + 0.8);

          cGain.gain.setValueAtTime(0.001, cTime);
          cGain.gain.linearRampToValueAtTime(0.045, cTime + 0.06);
          cGain.gain.exponentialRampToValueAtTime(0.0001, cTime + 0.9);

          cOsc.connect(cGain);
          cGain.connect(ctx.destination);
          cOsc.start(cTime);
          cOsc.stop(cTime + 0.95);
        });
      }

      // Ledakan Bass Berat Saat Partikel Mengumpul Kembali Menjadi Hati
      playGatheringBassImpact() {
        if (!this.ctx) return;
        const ctx = this.ctx;
        const now = ctx.currentTime;

        // Sub-Bass Shockwave Impact: 46Hz turun ke 20Hz
        const impactOsc = ctx.createOscillator();
        const impactGain = ctx.createGain();
        impactOsc.type = 'sine';
        impactOsc.frequency.setValueAtTime(46, now);
        impactOsc.frequency.exponentialRampToValueAtTime(20, now + 1.2);

        impactGain.gain.setValueAtTime(0.90, now);
        impactGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.35);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(120, now);
        filter.frequency.exponentialRampToValueAtTime(35, now + 1.15);

        impactOsc.connect(filter);
        filter.connect(impactGain);
        impactGain.connect(ctx.destination);
        impactOsc.start(now);
        impactOsc.stop(now + 1.4);

        // Chord Harmonik Lembut Penutup (432Hz)
        [216, 324, 432, 540].forEach((freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 2.3);
        });
      }

      // Detak Jantung Istirahat (Lub-Dub Bass)
      playHeartbeat() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        this.thump(now, 52, 26, 0.22, 0.42);
        this.thump(now + 0.16, 62, 30, 0.18, 0.30);
      }

      thump(time, startFreq, endFreq, dur, vol) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(startFreq, time);
        osc.frequency.exponentialRampToValueAtTime(endFreq, time + dur);

        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(120, time);
        filter.frequency.exponentialRampToValueAtTime(45, time + dur);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(time);
        osc.stop(time + dur);
      }

      startAmbient() {
        if (!this.ctx) return;
        this.ambientGain = this.ctx.createGain();
        this.ambientGain.gain.setValueAtTime(0.001, this.ctx.currentTime);
        this.ambientGain.gain.linearRampToValueAtTime(0.035, this.ctx.currentTime + 2.0);
        this.ambientGain.connect(this.ctx.destination);

        const baseFreqs = [108, 216, 324];
        this.ambientOscs = baseFreqs.map((freq, i) => {
          const osc = this.ctx.createOscillator();
          osc.type = i === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();
          lfo.frequency.value = 0.15 + i * 0.08;
          lfoGain.gain.value = 1.2;
          lfo.connect(osc.frequency);
          lfo.start();

          osc.connect(this.ambientGain);
          osc.start();
          return osc;
        });
      }
    }

    const sound = new SoundEngine();

    // =========================================================================
    // 2. THREE.JS PARTICLE SCENE DENGAN WARNA MULTI-KROMATIK MEWAH
    // =========================================================================
    function getHeartPoint(t) {
      const sinT = Math.sin(t);
      const cosT = Math.cos(t);
      const x = 16 * Math.pow(sinT, 3);
      const y = 13 * cosT - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return [x, y];
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.007);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 38);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);
    container.appendChild(renderer.domElement);

    // 45.000 Partikel Multi-Kromatik (Rose Gold, Cyan Aurora, Electric Violet, Diamond)
    const PARTICLE_COUNT = 45000;
    const scale = 0.60;
    const yCenterOffset = 2.4;

    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);
    const phases = new Float32Array(PARTICLE_COUNT);
    const vortexFactors = new Float32Array(PARTICLE_COUNT * 3);

    // Palet Warna Mewah
    const colRoseGold = new THREE.Color('#ff2a8d');   // Radiant Rose Magenta
    const colAuroraCyan = new THREE.Color('#00f0ff'); // Electric Aurora Cyan
    const colViolet = new THREE.Color('#8b2bf5');     // Royal Electric Violet
    const colGoldDust = new THREE.Color('#ffd166');   // Golden Starlight Embers
    const colDiamond = new THREE.Color('#ffffff');    // Diamond Sparkles

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const t = Math.random() * Math.PI * 2;
      const [rawX, rawY] = getHeartPoint(t);

      const randType = Math.random();
      let r, isShell = false;
      if (randType < 0.62) {
        r = 0.88 + Math.pow(Math.random(), 3.0) * 0.14;
        isShell = true;
      } else if (randType < 0.94) {
        r = Math.pow(Math.random(), 0.7) * 0.88;
      } else {
        r = 1.02 + Math.random() * 0.16;
      }

      const x2D = rawX * r * scale;
      const y2D = (rawY * r + yCenterOffset) * scale;
      const normH = Math.max(0, Math.min(1, (rawY + 17) / 33.5));
      const maxThickness = Math.pow(Math.sin(normH * Math.PI), 0.7) * 7.5 * scale;
      const radialRatio = Math.min(1, r);
      const zSpan = Math.sqrt(Math.max(0.01, 1 - radialRatio * radialRatio)) * maxThickness;

      let z = isShell 
        ? (Math.random() > 0.5 ? 1 : -1) * zSpan * 0.9 + (Math.random() - 0.5) * 0.3
        : (Math.random() * 2 - 1) * (zSpan * 0.9 + 0.1);

      positions[i3] = x2D;
      positions[i3 + 1] = y2D;
      positions[i3 + 2] = z;

      // Gradasi Multi-Warna Spektrum Mewah
      const pCol = new THREE.Color();
      const cPick = Math.random();

      if (cPick < 0.15) {
        pCol.copy(colDiamond);
        sizes[i] = 2.0 + Math.random() * 1.5;
      } else if (cPick < 0.38) {
        // Bagian atas memancarkan Rose Gold ke Golden Ember
        pCol.lerpColors(colRoseGold, colGoldDust, Math.random() * 0.8);
        sizes[i] = 1.2 + Math.random() * 1.3;
      } else if (cPick < 0.72) {
        // Cangkang transisi antara Rose Gold dan Aurora Cyan
        pCol.lerpColors(colRoseGold, colAuroraCyan, Math.random());
        sizes[i] = 1.0 + Math.random() * 1.2;
      } else {
        // Inti dalam elektrik violet mistis
        pCol.lerpColors(colViolet, colAuroraCyan, Math.random() * 0.7);
        sizes[i] = 0.9 + Math.random() * 1.0;
      }

      colors[i3] = pCol.r;
      colors[i3 + 1] = pCol.g;
      colors[i3 + 2] = pCol.b;

      phases[i] = Math.random() * Math.PI * 2;

      const distFromCenter = Math.sqrt(x2D * x2D + z * z);
      const centerFactor = Math.max(0, 1.0 - distFromCenter / 7.0);
      const heightVuln = (1.0 - normH);
      const vulnerability = Math.min(1.0, heightVuln * 0.7 + centerFactor * 0.6);

      vortexFactors[i3] = vulnerability;
      vortexFactors[i3 + 1] = 0.7 + Math.random() * 0.6;
      vortexFactors[i3 + 2] = Math.random() > 0.5 ? 1 : -1;
    }

    const heartGeo = new THREE.BufferGeometry();
    heartGeo.setAttribute('position', new THREE.BufferAttribute(positions.slice(), 3));
    heartGeo.setAttribute('basePosition', new THREE.BufferAttribute(positions, 3));
    heartGeo.setAttribute('pColor', new THREE.BufferAttribute(colors, 3));
    heartGeo.setAttribute('pSize', new THREE.BufferAttribute(sizes, 1));
    heartGeo.setAttribute('pPhase', new THREE.BufferAttribute(phases, 1));
    heartGeo.setAttribute('pVortexFactor', new THREE.BufferAttribute(vortexFactors, 3));

    const heartUniforms = {
      uTime: { value: 0 },
      uSurgeProgress: { value: 0 },
      uHeartbeat: { value: 0 },
      uBloomIntensity: { value: 1.05 }
    };

    const heartMat = new THREE.ShaderMaterial({
      vertexShader: `
        attribute vec3 basePosition;
        attribute vec3 pColor;
        attribute float pSize;
        attribute float pPhase;
        attribute vec3 pVortexFactor;

        uniform float uTime;
        uniform float uSurgeProgress;
        uniform float uHeartbeat;
        uniform float uBloomIntensity;

        varying vec3 vColor;
        varying float vAlpha;
        varying float vTwinkle;

        void main() {
          vec3 pos = basePosition;

          // Detak Jantung
          vec3 centerOffset = pos - vec3(0.0, 2.0, 0.0);
          pos += normalize(centerOffset) * uHeartbeat * 0.7;

          // Getaran Halus
          pos.x += sin(uTime * 2.0 + pPhase) * 0.08;
          pos.y += cos(uTime * 1.6 + pPhase) * 0.06;
          pos.z += sin(uTime * 2.2 + pPhase) * 0.08;

          // Vortex Panjang yang Memutar & Menyebar
          float vuln = pVortexFactor.x;
          if (uSurgeProgress > 0.001 && vuln > 0.05) {
            float surgePower = sin(uSurgeProgress * 3.14159265);
            float localPower = pow(surgePower, 1.25) * vuln;

            pos.y += localPower * 22.0 * pVortexFactor.y;

            float swirlAngle = (localPower * 10.5 + uTime * 3.8) * pVortexFactor.z;
            float curRadius = length(pos.xz);
            float newRadius = curRadius * (1.0 + localPower * 0.95) + localPower * 2.0;
            float totalAngle = atan(pos.z, pos.x) + swirlAngle;

            pos.x = cos(totalAngle) * newRadius;
            pos.z = sin(totalAngle) * newRadius;

            pos.x += sin(uTime * 30.0 + pos.y * 2.0) * localPower * 0.65;
            pos.z += cos(uTime * 26.0 + pos.y * 2.0) * localPower * 0.65;
          }

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float basePointSize = pSize * (205.0 / -mvPosition.z);
          float surgeBoost = 1.0 + sin(uSurgeProgress * 3.14159265) * 0.75 * vuln;
          gl_PointSize = clamp(basePointSize * (1.0 + uHeartbeat * 0.2) * surgeBoost, 1.0, 15.0);

          vTwinkle = sin(uTime * 3.2 + pPhase * 2.5) * 0.5 + 0.5;

          // Perubahan Warna Aurora Saat Memutar
          vec3 finalCol = pColor;
          if (uSurgeProgress > 0.001) {
            float surgeGlow = sin(uSurgeProgress * 3.14159265) * vuln;
            finalCol = mix(finalCol, vec3(1.0, 0.25, 0.65), surgeGlow * 0.65);
          }
          vColor = finalCol;
          vAlpha = clamp(0.75 + vTwinkle * 0.25, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        varying float vTwinkle;
        uniform float uBloomIntensity;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float dist = length(coord);
          if (dist > 0.5) discard;

          float core = smoothstep(0.18, 0.0, dist);
          float halo = exp(-dist * 11.5);

          float lightEnergy = (core * 2.4 + halo * 0.85) * uBloomIntensity;
          vec3 outColor = mix(vColor, vec3(1.0), core * 0.88);
          gl_FragColor = vec4(outColor * lightEnergy, halo * vAlpha);
        }
      `,
      uniforms: heartUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const heartPoints = new THREE.Points(heartGeo, heartMat);
    scene.add(heartPoints);

    // Kolam Energi Bawah (Rose-Gold & Cyan Pedestal)
    const poolGeo = new THREE.PlaneGeometry(16, 16, 32, 32);
    poolGeo.rotateX(-Math.PI / 2);

    const poolUniforms = {
      uTime: { value: 0 },
      uSurgeProgress: { value: 0 },
      uHeartbeat: { value: 0 }
    };

    const poolMat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uTime;
        uniform float uSurgeProgress;
        uniform float uHeartbeat;

        void main() {
          vec2 p = vUv - vec2(0.5);
          p.y *= 2.5;
          float d = length(p);
          if (d > 0.5) discard;

          float angle = atan(p.y, p.x);
          float swirl = sin(d * 28.0 - uTime * 4.0 + angle * 3.0);
          float brightCore = smoothstep(0.2, 0.0, d);
          float midGlow = exp(-d * 6.0);
          float outerHalo = exp(-d * 3.5);

          float surgeFlare = sin(uSurgeProgress * 3.14159265) * 1.5;
          float energy = (brightCore * 3.2 + midGlow * 2.0 + outerHalo * 0.8 + swirl * 0.25 * midGlow) * (1.0 + surgeFlare + uHeartbeat * 0.3);

          vec3 col = mix(vec3(1.0, 0.2, 0.6), vec3(0.0, 0.7, 1.0), d * 1.8);
          col = mix(col, vec3(1.0), brightCore * 0.9);

          gl_FragColor = vec4(col * energy, clamp((midGlow * 1.4 + brightCore) * (1.0 - d * 2.0), 0.0, 1.0));
        }
      `,
      uniforms: poolUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });

    const poolMesh = new THREE.Mesh(poolGeo, poolMat);
    poolMesh.position.set(0, -11.6, 0);
    scene.add(poolMesh);

    // 30 Tendril Pita Plasma Spiral
    const numTendrils = 30;
    const pointsPerTendril = 64;
    const tendrilLines = [];
    const tendrilConfigs = [];

    for (let t = 0; t < numTendrils; t++) {
      const baseAngle = (t / numTendrils) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const speed = 4.2 + Math.random() * 3.8;
      const radiusScale = 0.55 + Math.random() * 0.85;
      const heightOffset = (Math.random() - 0.5) * 4.0;
      const swirlTension = 1.3 + Math.random() * 1.6;

      const pts = [];
      const cols = [];
      for (let p = 0; p < pointsPerTendril; p++) {
        pts.push(new THREE.Vector3(0, -15, 0));
        const pNorm = p / (pointsPerTendril - 1);
        const c = new THREE.Color();
        if (pNorm > 0.8) c.lerpColors(colAuroraCyan, colDiamond, (pNorm - 0.8) / 0.2);
        else if (pNorm > 0.35) c.lerpColors(colRoseGold, colAuroraCyan, (pNorm - 0.35) / 0.45);
        else c.lerpColors(colViolet, colRoseGold, pNorm / 0.35);
        cols.push(c.r, c.g, c.b);
      }

      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      lineGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      const lineMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        linewidth: 2
      });

      const line = new THREE.Line(lineGeo, lineMat);
      scene.add(line);
      tendrilLines.push(line);
      tendrilConfigs.push({ baseAngle, speed, radiusScale, heightOffset, swirlTension });
    }

    // =========================================================================
    // 3. ANIMASI PANJANG & INTERAKSI KETUKAN (TAP TO SURGE)
    // =========================================================================
    const state = {
      phase: 'idle',
      phaseTime: 0,
      cycleTimer: 0,
      surgeProgress: 0,
      rotation: { x: 0.05, y: 0, targetX: 0.05, targetY: 0 },
      isDragging: false,
      dragStart: { x: 0, y: 0 },
      pointerDownTime: 0,
      zoom: 38
    };

    // Fungsi Memicu Vortex & Suara Bass
    function triggerVortex() {
      if (state.phase === 'vortex' || state.phase === 'charging') return;
      state.phase = 'vortex';
      state.phaseTime = 0;
      sound.playTapBassDrop();  // Dentuman sub-bass 808
      sound.playVortexSurge();   // Gemuruh & putaran panjang
    }

    // Interaksi: Cukup Diketuk / Dipencet di Layar
    window.addEventListener('pointerdown', (e) => {
      state.isDragging = true;
      state.dragStart = { x: e.clientX, y: e.clientY };
      state.pointerDownTime = performance.now();
    });

    window.addEventListener('pointermove', (e) => {
      if (!state.isDragging) return;
      const dx = e.clientX - state.dragStart.x;
      const dy = e.clientY - state.dragStart.y;
      state.rotation.targetY += dx * 0.008;
      state.rotation.targetX = Math.max(-0.6, Math.min(0.6, state.rotation.targetX + dy * 0.006));
      state.dragStart = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('pointerup', (e) => {
      const clickDuration = performance.now() - state.pointerDownTime;
      state.isDragging = false;

      // Jika diketuk (< 300ms), picu animasi & dentuman suara!
      if (clickDuration < 300) {
        triggerVortex();
        const hint = document.getElementById('hint');
        if (hint) hint.style.display = 'none';
      }
    });

    window.addEventListener('wheel', (e) => {
      state.zoom = Math.max(22, Math.min(55, state.zoom + e.deltaY * 0.03));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let lastBeat = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      state.phaseTime += delta;
      state.cycleTimer += delta;

      // Auto cycle setiap 14 detik jika tidak diketuk
      if (state.cycleTimer >= 14.0) {
        state.cycleTimer = 0;
        triggerVortex();
      }

      // Animasi Panjang Sinematik (~11.5 Detik)
      if (state.phase === 'vortex') {
        const vortexDuration = 6.8; // Durasi putaran panjang
        state.surgeProgress = Math.min(1.0, state.phaseTime / vortexDuration);
        if (state.surgeProgress >= 1.0) {
          state.phase = 'reforming';
          state.phaseTime = 0;
          sound.playGatheringBassImpact(); // Ledakan bass saat partikel mulai mengumpul kembali!
        }
      } else if (state.phase === 'reforming') {
        const reformDuration = 3.6; // Gerakan gravitasi kembali membentuk hati
        state.surgeProgress = 1.0 - Math.min(1.0, state.phaseTime / reformDuration);
        if (state.surgeProgress <= 0.0) {
          state.phase = 'idle';
          state.phaseTime = 0;
          state.surgeProgress = 0;
        }
      }

      // Detak Jantung
      const beatCycle = (elapsed * 0.9) % 1.0;
      let beat = 0;
      if (beatCycle < 0.12) beat = Math.sin((beatCycle / 0.12) * Math.PI) * 0.085;
      else if (beatCycle > 0.18 && beatCycle < 0.32) beat = Math.sin(((beatCycle - 0.18) / 0.14) * Math.PI) * 0.055;

      if (beatCycle < 0.04 && elapsed - lastBeat > 0.7) {
        lastBeat = elapsed;
        sound.playHeartbeat();
      }

      heartUniforms.uTime.value = elapsed;
      heartUniforms.uSurgeProgress.value = state.surgeProgress;
      heartUniforms.uHeartbeat.value = beat;

      poolUniforms.uTime.value = elapsed;
      poolUniforms.uSurgeProgress.value = state.surgeProgress;
      poolUniforms.uHeartbeat.value = beat;

      // Animasi Pita Plasma Spiral
      const surgeVal = state.surgeProgress;
      const tendrilOp = Math.pow(Math.sin(surgeVal * Math.PI), 1.25);

      for (let t = 0; t < numTendrils; t++) {
        const line = tendrilLines[t];
        const cfg = tendrilConfigs[t];
        line.material.opacity = tendrilOp;

        if (surgeVal > 0.005) {
          const posArr = line.geometry.attributes.position.array;
          const rotSpeed = cfg.speed * elapsed * 2.8;
          const climb = Math.min(1.0, surgeVal * 1.55);

          for (let p = 0; p < pointsPerTendril; p++) {
            const pNorm = p / (pointsPerTendril - 1);
            const targetY = -11.6 + pNorm * climb * (24.0 + cfg.heightOffset);
            const radius = (Math.sin(pNorm * Math.PI) * 5.6 + 0.95) * cfg.radiusScale;
            const angle = cfg.baseAngle + rotSpeed + pNorm * (8.8 * cfg.swirlTension);

            const p3 = p * 3;
            posArr[p3] = Math.cos(angle) * radius + Math.sin(elapsed * 28.0 + p) * 0.15 * surgeVal;
            posArr[p3 + 1] = targetY;
            posArr[p3 + 2] = Math.sin(angle) * radius + Math.cos(elapsed * 25.0 + p) * 0.15 * surgeVal;
          }
          line.geometry.attributes.position.needsUpdate = true;
        }
      }

      // Rotasi 3D Halus
      state.rotation.x += (state.rotation.targetX - state.rotation.x) * 0.08;
      state.rotation.y += (state.rotation.targetY - state.rotation.y) * 0.08;

      heartPoints.rotation.y = state.rotation.y;
      heartPoints.rotation.x = state.rotation.x;
      poolMesh.rotation.y = state.rotation.y * 0.5;

      camera.position.z += (state.zoom - camera.position.z) * 0.08;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
