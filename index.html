<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Heart Particle Glow - Lightweight & Smooth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <script>
    /* ========================================================
       1. SYNTH AUDIO (SUB-BASS & WOOSH PUTARAN)
       ======================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    ['touchstart', 'mousedown', 'pointerdown'].forEach(ev => {
      window.addEventListener(ev, ensureAudio, { once: true, passive: true });
    });

    // Suara whoosh berkumpul/berputar
    function playGatherSound() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(35, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 1.2);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(70, t);
      filter.frequency.linearRampToValueAtTime(240, t + 1.2);

      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.45, t + 0.6);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.4);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + 1.4);
    }

    // Suara ledakan sub-bass bioskop saat diketuk
    function playHeavyBassExplosion() {
      ensureAudio();
      const t = audioCtx.currentTime;

      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(160, t);
      subOsc.frequency.exponentialRampToValueAtTime(24, t + 1.1);

      subGain.gain.setValueAtTime(1.0, t);
      subGain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);

      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(t);
      subOsc.stop(t + 1.2);

      // Shimmer sparkle halus
      const bufSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1400, t);
      filter.Q.setValueAtTime(2.5, t);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.35, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      noise.start(t);
      noise.stop(t + 0.5);
    }

    /* ========================================================
       2. PARTICLE SIMULATION (RINGAN & OPTIMAL)
       ======================================================== */
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const BLUE_SHADES = [
      '#ffffff',
      '#bae6fd',
      '#38bdf8',
      '#0ea5e9',
      '#2563eb',
      '#1d4ed8'
    ];

    function getHeartPoint(t, scale = 14) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    // Hitungan partikel ideal agar rapat namun anti-lag
    const HEART_COUNT = 900; 
    const VORTEX_COUNT = 65; // Cukup 65 partikel cincin agar tidak menumpuk kotor
    const STREAM_COUNT = 40; // Aliran partikel melayang naik

    const heartParticles = [];
    const vortexParticles = [];
    const streamParticles = [];
    const burstParticles = [];

    class Particle {
      constructor(type) {
        this.type = type;
        this.color = BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];
        this.size = Math.random() * 2.0 + 0.8;

        if (type === 'vortex') {
          this.angle = Math.random() * Math.PI * 2;
          this.radius = Math.random() * 60 + 15;
          this.speed = Math.random() * 0.04 + 0.02;
          this.yOffset = (Math.random() - 0.5) * 8;
        } else if (type === 'stream') {
          this.resetStream();
        } else if (type === 'heart') {
          this.t = Math.random() * Math.PI * 2;
          const isEdge = Math.random() > 0.3;
          const s = isEdge ? 1 : Math.sqrt(Math.random());
          const pt = getHeartPoint(this.t, 14 * s);
          this.targetX = pt.x;
          this.targetY = pt.y;
          this.x = width / 2;
          this.y = height * 0.72;
          this.speed = Math.random() * 0.05 + 0.02;
          this.orbitAngle = Math.random() * Math.PI * 2;
          this.orbitSpeed = (Math.random() - 0.5) * 0.03;
          this.orbitRadius = Math.random() * 6;
          this.scatterX = 0;
          this.scatterY = 0;
        } else if (type === 'burst') {
          this.x = width / 2;
          this.y = height / 2 - 20;
          const angle = Math.random() * Math.PI * 2;
          const force = Math.random() * 18 + 4;
          this.vx = Math.cos(angle) * force;
          this.vy = Math.sin(angle) * force;
          this.size = Math.random() * 3.2 + 1.0;
          this.decay = 0.93;
        }
      }

      resetStream() {
        this.x = width / 2 + (Math.random() - 0.5) * 40;
        this.y = height * 0.72;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = -Math.random() * 2.2 - 0.8;
        this.life = 0;
        this.maxLife = Math.random() * 50 + 30;
      }

      update(beat = 1) {
        if (this.type === 'vortex') {
          this.angle += this.speed;
          const cx = width / 2;
          const cy = height * 0.72;
          // Cincin elips horizontal tipis
          this.x = cx + Math.cos(this.angle) * (this.radius * 1.5);
          this.y = cy + Math.sin(this.angle) * (this.radius * 0.35) + this.yOffset;
        } else if (this.type === 'stream') {
          this.life++;
          this.x += this.vx;
          this.y += this.vy;
          const targetY = height / 2 + 120;
          this.vx += ((width / 2) - this.x) * 0.02;
          if (this.life > this.maxLife || this.y < targetY) this.resetStream();
        } else if (this.type === 'heart') {
          this.orbitAngle += this.orbitSpeed;
          const ox = Math.cos(this.orbitAngle) * this.orbitRadius;
          const oy = Math.sin(this.orbitAngle) * this.orbitRadius;

          const cx = width / 2;
          const cy = height / 2 - 20;

          const tx = cx + (this.targetX * beat) + ox + this.scatterX;
          const ty = cy + (this.targetY * beat) + oy + this.scatterY;

          this.x += (tx - this.x) * this.speed;
          this.y += (ty - this.y) * this.speed;

          this.scatterX *= 0.91;
          this.scatterY *= 0.91;
        } else if (this.type === 'burst') {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= this.decay;
          this.vy *= this.decay;
          this.size *= 0.95;
        }
      }

      draw(c) {
        c.fillStyle = this.color;
        c.beginPath();
        c.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
        c.fill();
      }
    }

    // Buat partikel
    for (let i = 0; i < VORTEX_COUNT; i++) vortexParticles.push(new Particle('vortex'));
    for (let i = 0; i < STREAM_COUNT; i++) streamParticles.push(new Particle('stream'));
    for (let i = 0; i < HEART_COUNT; i++) heartParticles.push(new Particle('heart'));

    function spawnBurst(cx, cy) {
      for (let i = 0; i < 180; i++) {
        const p = new Particle('burst');
        p.x = cx;
        p.y = cy;
        burstParticles.push(p);
      }
    }

    /* ========================================================
       3. LOOP RENDER (60 FPS RINGAN TANPA SHADOWBLUR)
       ======================================================== */
    let time = 0;

    function render() {
      time += 0.04;

      // Jejak fade halus
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(0, 0, width, height);

      // Glow blending natural tanpa komputasi berat
      ctx.globalCompositeOperation = 'lighter';

      // Cahaya lembut di dasar (pedestal ring)
      const cx = width / 2;
      const cy = height * 0.72;
      const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 110);
      grad.addColorStop(0, 'rgba(56, 189, 248, 0.65)');
      grad.addColorStop(0.3, 'rgba(37, 99, 235, 0.25)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, 120, 28, 0, 0, Math.PI * 2);
      ctx.fill();

      // Render pusaran bawah
      for (let i = 0; i < vortexParticles.length; i++) {
        vortexParticles[i].update();
        vortexParticles[i].draw(ctx);
      }

      // Render partikel naik
      for (let i = 0; i < streamParticles.length; i++) {
        streamParticles[i].update();
        streamParticles[i].draw(ctx);
      }

      // Render partikel hati dengan detak halus
      const beat = 1 + Math.sin(time * 2.6) * 0.03;
      for (let i = 0; i < heartParticles.length; i++) {
        heartParticles[i].update(beat);
        heartParticles[i].draw(ctx);
      }

      // Render ledakan saat diklik
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.update();
        p.draw(ctx);
        if (p.size < 0.25) burstParticles.splice(i, 1);
      }

      requestAnimationFrame(render);
    }
    render();

    // Suara whoosh berulang saat partikel memadat
    setInterval(() => {
      if (audioCtx) playGatherSound();
    }, 4200);

    /* ========================================================
       4. INTERAKSI KETUK
       ======================================================== */
    window.addEventListener('pointerdown', () => {
      playHeavyBassExplosion();

      const cx = width / 2;
      const cy = height / 2 - 20;

      spawnBurst(cx, cy);

      // Partikel hati terpental rapi keluar lalu menyatu kembali
      for (let i = 0; i < heartParticles.length; i++) {
        const p = heartParticles[i];
        const angle = Math.atan2(p.y - cy, p.x - cx) + (Math.random() - 0.5) * 0.4;
        const force = Math.random() * 220 + 100;
        p.scatterX = Math.cos(angle) * force;
        p.scatterY = Math.sin(angle) * force;
      }
    });
  </script>
</body>
</html>
