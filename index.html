<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart Particle Burst</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
    width: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  setupHeartPosition();
}
window.addEventListener('resize', resize);

const BLUE_SHADES = [
  "#3b82f6", "#60a5fa", // blue-400/500
  "#93c5fd", "#2563eb", // blue-600
  "#bfdbfe", "#1d4ed8", // blue-700
];

function randomColor() {
  return BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];
}

const floatParticles = [];
const burstParticles = [];
const FLOAT_COUNT = 140;
const BURST_COUNT = 140;

let heartCenterX, heartCenterY, heartScale, poolX, poolY;

function setupHeartPosition() {
  heartCenterX = width / 2;
  heartCenterY = height * 0.4;
  heartScale = Math.min(width, height) * 0.018;
  poolX = width / 2;
  poolY = height * 0.74;
}

class Particle {
  constructor(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type;
    this.color = randomColor();
    this.alpha = 1;

    if (type === "float") {
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = -(Math.random() * 0.6 + 0.2);
      this.size = Math.random() * 1.6 + 0.5;
      this.maxLife = Math.random() * 200 + 150;
      this.life = Math.random() * this.maxLife; // stagger starting life
      this.twinkleSpeed = Math.random() * 0.05 + 0.02;
      this.twinklePhase = Math.random() * Math.PI * 2;
    } else if (type === "burst") {
      this.startX = x;
      this.startY = y;

      // vortex (swirl) parameters
      this.vortexAngle = Math.random() * Math.PI * 2;
      this.vortexRadius = Math.random() * 45 + 15;
      this.vortexSpeed = 0.06 + Math.random() * 0.08;
      this.vortexDuration = Math.random() * 60 + 50;
      this.vortexTimer = 0;

      // target point on the heart outline
      const t = Math.random() * Math.PI * 2;
      const hx = 16 * Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      const jitter = Math.random() * 9;
      const angleJ = Math.random() * Math.PI * 2;
      this.targetX = heartCenterX + hx * heartScale + Math.cos(angleJ) * jitter;
      this.targetY = heartCenterY + hy * heartScale + Math.sin(angleJ) * jitter;

      this.phase = "vortex"; // vortex -> rising -> holding -> exploding
      this.riseProgress = 0;
      this.riseSpeed = Math.random() * 0.02 + 0.012;
      this.holdTime = 0;
      this.maxHold = Math.random() * 60 + 90;
      this.size = Math.random() * 2.2 + 0.8;
      this.explodeVX = 0;
      this.explodeVY = 0;
      this.alpha = 0;
    }
  }

  update() {
    if (this.type === "float") {
      this.x += this.vx;
      this.y += this.vy;
      this.life++;
      this.twinklePhase += this.twinkleSpeed;
      this.alpha = Math.sin(this.twinklePhase) * 0.35 + 0.55;
      if (this.life > this.maxLife || this.y < -10) this.reset();
      return;
    }

    if (this.phase === "vortex") {
      this.vortexTimer++;
      this.vortexAngle += this.vortexSpeed;
      this.vortexRadius *= 0.995; // spiral tightens slowly while swirling
      this.x = this.startX + Math.cos(this.vortexAngle) * this.vortexRadius;
      this.y = this.startY + Math.sin(this.vortexAngle) * this.vortexRadius * 0.35;
      this.alpha = Math.min(this.vortexTimer / 20, 1);

      if (this.vortexTimer > this.vortexDuration) {
        this.phase = "rising";
        this.riseStartX = this.x;
        this.riseStartY = this.y;
      }
    } else if (this.phase === "rising") {
      this.riseProgress += this.riseSpeed;
      if (this.riseProgress >= 1) {
        this.riseProgress = 1;
        this.phase = "holding";
      }
      const ease = 1 - Math.pow(1 - this.riseProgress, 3);
      const spiralRadius = this.vortexRadius * (1 - ease); // funnel narrows as it nears the heart
      const spiralAngle = this.vortexAngle + this.riseProgress * 8;
      const baseX = this.riseStartX + (this.targetX - this.riseStartX) * ease;
      const baseY = this.riseStartY + (this.targetY - this.riseStartY) * ease;
      this.x = baseX + Math.cos(spiralAngle) * spiralRadius;
      this.y = baseY + Math.sin(spiralAngle) * spiralRadius * 0.5;
      this.alpha = 1;
    } else if (this.phase === "holding") {
      this.holdTime++;
      this.x = this.targetX + Math.sin(this.holdTime * 0.05 + this.targetX) * 0.4;
      this.y = this.targetY + Math.cos(this.holdTime * 0.05 + this.targetY) * 0.4;
      this.alpha = 0.85 + Math.sin(this.holdTime * 0.1) * 0.15;
      if (this.holdTime > this.maxHold) {
        this.phase = "exploding";
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 3 + 1.5;
        this.explodeVX = Math.cos(angle) * force;
        this.explodeVY = Math.sin(angle) * force - 1;
      }
    } else if (this.phase === "exploding") {
      this.x += this.explodeVX;
      this.y += this.explodeVY;
      this.explodeVX *= 0.96;
      this.explodeVY *= 0.96;
      this.alpha -= 0.02;
    }
  }

  reset() {
    this.x = Math.random() * width;
    this.y = height + Math.random() * 40;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = -(Math.random() * 0.6 + 0.2);
    this.life = 0;
    this.maxLife = Math.random() * 200 + 150;
    this.color = randomColor();
  }

  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(this.alpha, 0);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  isDead() {
    return this.type === "burst" && this.phase === "exploding" && this.alpha <= 0;
  }
}

function spawnHeartBurst(x, y) {
  const count = BURST_COUNT;
  for (let i = 0; i < count; i++) {
    burstParticles.push(new Particle(x, y, "burst"));
  }
}

function drawGlowPool() {
  const t = performance.now() * 0.002;
  const pulse = Math.sin(t) * 0.15 + 0.85;
  const grad = ctx.createRadialGradient(poolX, poolY, 0, poolX, poolY, 90 * pulse);
  grad.addColorStop(0, "rgba(191,219,254,0.9)");
  grad.addColorStop(0.4, "rgba(59,130,246,0.5)");
  grad.addColorStop(1, "rgba(59,130,246,0)");
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(poolX, poolY, 70 * pulse, 20 * pulse, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.fillRect(0, 0, width, height);

  ctx.globalCompositeOperation = "lighter";

  drawGlowPool();

  for (const p of floatParticles) {
    p.update();
    p.draw();
  }

  for (let i = burstParticles.length - 1; i >= 0; i--) {
    const p = burstParticles[i];
    p.update();
    p.draw();
    if (p.isDead()) burstParticles.splice(i, 1);
  }

  ctx.globalCompositeOperation = "source-over";

  if (burstParticles.length === 0) {
    spawnHeartBurst(poolX, poolY);
  }

  requestAnimationFrame(animate);
}

resize();

for (let i = 0; i < FLOAT_COUNT; i++) {
  const p = new Particle(Math.random() * width, Math.random() * height, "float");
  floatParticles.push(p);
}

spawnHeartBurst(poolX, poolY);
animate();
</script>
</body>
</html>
