<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Heart Particle Glow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <script>
    /* ========================================================
       1. ZERO-LATENCY SUB-BASS SYNTH AUDIO ENGINE
       ======================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // Unmute audio context saat ada interaksi pertama
    ['touchstart', 'mousedown', 'pointerdown'].forEach(ev => {
      window.addEventListener(ev, ensureAudio, { once: true, passive: true });
    });

    function makeDistortionCurve(amount = 20) {
      const k = amount;
      const n = 44100;
      const curve = new Float32Array(n);
      const deg = Math.PI / 180;
      for (let i = 0; i < n; ++i) {
        let x = (i * 2) / n - 1;
        curve[i] = ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    // Suara whoosh bass halus saat partikel berputar & merapat
    function playGatherSound() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(36, t);
      osc.frequency.exponentialRampToValueAtTime(110, t + 1.2);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(65, t);
      filter.frequency.exponentialRampToValueAtTime(320, t + 1.2);

      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.4, t + 0.7);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.3);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + 1.3);
    }

    // Suara ledakan sub-bass mewah menggelegar seketika saat diketuk
    function playHeavyBassExplosion() {
      ensureAudio();
      const t = audioCtx.currentTime;

      // Layer 1: Sub-Bass Drop (170Hz -> 25Hz)
      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(170, t);
      subOsc.frequency.exponentialRampToValueAtTime(25, t + 1.2);

      subGain.gain.setValueAtTime(1.0, t);
      subGain.gain.exponentialRampToValueAtTime(0.001, t + 1.3);

      subOsc.connect(subGain);
      subGain.connect(audioCtx.destination);
      subOsc.start(t);
      subOsc.stop(t + 1.3);

      // Layer 2: Warm Punch Saturator
      const punchOsc = audioCtx.createOscillator();
      const punchGain = audioCtx.createGain();
      const dist = audioCtx.createWaveShaper();
      dist.curve = makeDistortionCurve(15);

      punchOsc.type = 'triangle';
      punchOsc.frequency.setValueAtTime(95, t);
      punchOsc.frequency.exponentialRampToValueAtTime(30, t + 0.6);

      punchGain.gain.setValueAtTime(0.75, t);
      punchGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);

      punchOsc.connect(dist);
      dist.connect(punchGain);
      punchGain.connect(audioCtx.destination);
      punchOsc.start(t);
      punchOsc.stop(t + 0.6);

      // Layer 3: Shimmer Air Sparkle
      const bufferSize = audioCtx.sampleRate * 0.7;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1500, t);
      filter.Q.setValueAtTime(3, t);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.4, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      noise.start(t);
      noise.stop(t + 0.7);
    }

    /* ========================================================
       2. HEART PARTICLE SYSTEM (REPLIKA PERSIS @FRONTIEND)
       ======================================================== */
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const floatParticles = [];
    let burstParticles = [];
    const heartParticles = [];
    const FLOAT_COUNT = 140;

    const BLUE_SHADES = [
      '#38b2f6', // blue-400
      '#06b6f4', // blue-600
      '#93c5fd', // blue-600
      '#2563eb', // blue-600
      '#bfdbfe', // blue-700
      '#1d4ed8'  // blue-700
    ];

    function getHeartPoint(t, scale = 14) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x: x * scale, y: y * scale };
    }

    class Particle {
      constructor(x, y, type = 'float') {
        this.x = x;
        this.y = y;
        this.type = type;
        this.color = BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];
        this.life = 0;
        this.maxLife = Math.random() * 120 + 80;
        this.size = Math.random() * 2.2 + 0.8;

        if (type === 'float') {
          this.vx = (Math.random() - 0.5) * 0.8;
          this.vy = -Math.random() * 1.8 - 0.6;
          this.size = Math.random() * 1.8 + 0.5;
        } else if (type === 'heart') {
          this.t = Math.random() * Math.PI * 2;
          this.target = getHeartPoint(this.t);
          this.speed = Math.random() * 0.04 + 0.02;
          this.orbitAngle = Math.random() * Math.PI * 2;
          this.orbitSpeed = (Math.random() - 0.5) * 0.04;
          this.orbitRadius = Math.random() * 14;
          this.scatterForceX = 0;
          this.scatterForceY = 0;
        } else if (type === 'burst') {
          const angle = Math.random() * Math.PI * 2;
          const force = Math.random() * 16 + 4;
          this.vx = Math.cos(angle) * force;
          this.vy = Math.sin(angle) * force;
          this.size = Math.random() * 3.5 + 1.5;
          this.decay = 0.94;
        }
      }

      update() {
        this.life++;
        if (this.type === 'float') {
          this.y += this.vy;
          this.x += this.vx;
          if (this.y < height * 0.25) {
            this.y = height * 0.72 + (Math.random() - 0.5) * 30;
            this.x = width / 2 + (Math.random() - 0.5) * 200;
          }
        } else if (this.type === 'heart') {
          this.orbitAngle += this.orbitSpeed;
          const ox = Math.cos(this.orbitAngle) * this.orbitRadius;
          const oy = Math.sin(this.orbitAngle) * this.orbitRadius;

          const targetX = width / 2 + this.target.x + ox + this.scatterForceX;
          const targetY = height / 2 - 20 + this.target.y + oy + this.scatterForceY;

          this.x += (targetX - this.x) * this.speed;
          this.y += (targetY - this.y) * this.speed;

          // Mengurangi gaya hamburan ledakan secara perlahan agar menyatu kembali
          this.scatterForceX *= 0.92;
          this.scatterForceY *= 0.92;
        } else if (this.type === 'burst') {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= this.decay;
          this.vy *= this.decay;
          this.size *= 0.96;
        }
      }

      draw(c) {
        c.save();
        c.fillStyle = this.color;
        c.shadowColor = this.color;
        c.shadowBlur = 12;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    // Inisialisasi partikel dasar yang melayang
    for (let i = 0; i < FLOAT_COUNT; i++) {
      const p = new Particle(
        width / 2 + (Math.random() - 0.5) * 220,
        height * 0.72 + (Math.random() - 0.5) * 40,
        'float'
      );
      p.life = Math.random() * p.maxLife;
      floatParticles.push(p);
    }

    // Inisialisasi partikel pembentuk hati
    for (let i = 0; i < 520; i++) {
      heartParticles.push(new Particle(Math.random() * width, Math.random() * height, 'heart'));
    }

    function spawnHeartBurst(x, y) {
      const count = 160;
      for (let i = 0; i < count; i++) {
        burstParticles.push(new Particle(x, y, 'burst'));
      }
    }

    /* ========================================================
       3. LOOP ANIMASI & RENDER
       ======================================================== */
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, width, height);

      // Cahaya kabut / pedestal biru terang di dasar
      const grad = ctx.createRadialGradient(
        width / 2, height * 0.72, 10,
        width / 2, height * 0.72, 160
      );
      grad.addColorStop(0, 'rgba(56, 178, 246, 0.45)');
      grad.addColorStop(0.5, 'rgba(37, 99, 235, 0.16)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(width / 2, height * 0.72, 170, 48, 0, 0, Math.PI * 2);
      ctx.fill();

      // Partikel melayang ke atas
      floatParticles.forEach(p => {
        p.update();
        p.draw(ctx);
      });

      // Partikel hati
      heartParticles.forEach(p => {
        p.update();
        p.draw(ctx);
      });

      // Partikel ledakan (dibersihkan saat mengecil)
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const p = burstParticles[i];
        p.update();
        p.draw(ctx);
        if (p.size < 0.2) {
          burstParticles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }
    animate();

    // Suara deburan menyatu berkala
    setInterval(() => {
      if (audioCtx) playGatherSound();
    }, 4200);

    /* ========================================================
       4. INTERAKSI KETUK
       ======================================================== */
    window.addEventListener('pointerdown', (e) => {
      // Suara bass langsung aktif
      playHeavyBassExplosion();

      const cx = width / 2;
      const cy = height / 2 - 20;

      // Ledakan partikel keluar
      spawnHeartBurst(cx, cy);

      // Partikel hati terlempar pecah lalu tertarik kembali
      heartParticles.forEach(p => {
        const angle = Math.atan2(p.y - cy, p.x - cx) + (Math.random() - 0.5) * 0.5;
        const force = Math.random() * 240 + 100;
        p.scatterForceX = Math.cos(angle) * force;
        p.scatterForceY = Math.sin(angle) * force;
      });
    });
  </script>
</body>
</html>
