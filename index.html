<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Volumetric Blue Heart Glow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <script>
    /* ========================================================
       1. SYNTH AUDIO: SUB-BASS BUBBLE & EXPLOSION
       ======================================================== */
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    ['touchstart', 'mousedown', 'pointerdown'].forEach(ev => {
      window.addEventListener(ev, ensureAudio, { once: true, passive: true });
    });

    function playSwirlSound() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(36, t);
      osc.frequency.exponentialRampToValueAtTime(105, t + 1.2);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(70, t);
      filter.frequency.exponentialRampToValueAtTime(300, t + 1.2);

      gain.gain.setValueAtTime(0.001, t);
      gain.gain.linearRampToValueAtTime(0.35, t + 0.6);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.4);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(t);
      osc.stop(t + 1.4);
    }

    function playBassExplosion() {
      ensureAudio();
      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, t);
      osc.frequency.exponentialRampToValueAtTime(22, t + 1.2);

      gain.gain.setValueAtTime(1.0, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.3);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 1.3);

      const bufSize = audioCtx.sampleRate * 0.5;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1400, t);
      filter.Q.setValueAtTime(2.5, t);

      const nGain = audioCtx.createGain();
      nGain.gain.setValueAtTime(0.35, t);
      nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);

      noise.connect(filter);
      filter.connect(nGain);
      nGain.connect(audioCtx.destination);

      noise.start(t);
      noise.stop(t + 0.6);
    }

    /* ========================================================
       2. VOLUMETRIC HEART PARTICLES ENGINE (PERSIS VIDEO)
       ======================================================== */
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Palet warna bintang debu biru pekat & cyan neon
    const BLUE_PALETTE = [
      '#ffffff',
      '#bae6fd',
      '#38bdf8',
      '#0284c7',
      '#2563eb',
      '#1d4ed8',
      '#1e3a8a'
    ];

    // Fungsi uji apakah titik (x, y) berada di dalam volume hati
    function isInsideHeart(x, y) {
      // Rumus implisit bentuk hati: (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
      const a = x * x + y * y - 1;
      return (a * a * a - x * x * y * y * y) <= 0;
    }

    const HEART_COUNT = 2400; // Ribuan bintik padat mengisi volume hati
    const heartParticles = [];

    const HEART_SCALE = 180; // Ukuran hati responsif

    for (let i = 0; i < HEART_COUNT; i++) {
      let hx, hy;
      // Sampling titik acak sampai berada di dalam atau di batas hati
      while (true) {
        hx = (Math.random() * 3.2 - 1.6);
        hy = (Math.random() * 3.0 - 1.3);
        if (isInsideHeart(hx, hy)) {
          // Tambahkan sedikit noise di sekitar tepi agar natural
          break;
        }
      }

      // Konversi ke koordinat piksel (dibalik karena sumbu Y layar ke bawah)
      const px = hx * HEART_SCALE;
      const py = -hy * HEART_SCALE;

      heartParticles.push({
        baseX: px,
        baseY: py,
        x: px,
        y: py,
        size: Math.random() * 1.6 + 0.5,
        color: BLUE_PALETTE[Math.floor(Math.random() * BLUE_PALETTE.length)],
        alpha: Math.random() * 0.7 + 0.3,
        // Getaran mikro agar debu bintang berkedip dan melayang hidup
        driftAngle: Math.random() * Math.PI * 2,
        driftSpeed: Math.random() * 0.04 + 0.02,
        driftRadius: Math.random() * 4 + 1,
        scatterX: 0,
        scatterY: 0
      });
    }

    /* Partikel Gerak Melilit Halus dari Bawah */
    const SWIRL_COUNT = 35;
    const swirlParticles = [];

    for (let i = 0; i < SWIRL_COUNT; i++) {
      swirlParticles.push({
        angle: Math.random() * Math.PI * 2,
        yProgress: Math.random(),
        speedY: Math.random() * 0.007 + 0.005,
        rotSpeed: Math.random() * 0.06 + 0.04,
        radius: Math.random() * 35 + 45,
        color: Math.random() > 0.4 ? '#38bdf8' : '#ffffff',
        size: Math.random() * 2.0 + 0.8,
        prevX: 0,
        prevY: 0
      });
    }

    const burstParticles = [];

    /* ========================================================
       3. ANIMATION LOOP
       ======================================================== */
    let animTime = 0;

    function render() {
      animTime += 0.03;

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cyHeart = height / 2 - 35;
      const cyBase = height * 0.78;

      ctx.globalCompositeOperation = 'lighter';

      /* --- 1. Portal Cyan di Dasar --- */
      const baseGlow = ctx.createRadialGradient(cx, cyBase, 2, cx, cyBase, 105);
      baseGlow.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
      baseGlow.addColorStop(0.2, 'rgba(56, 189, 248, 0.75)');
      baseGlow.addColorStop(0.55, 'rgba(37, 99, 235, 0.25)');
      baseGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = baseGlow;
      ctx.beginPath();
      ctx.ellipse(cx, cyBase, 110, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cincin pendaran halus
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(cx, cyBase, 102, 20, 0, 0, Math.PI * 2);
      ctx.stroke();

      /* --- 2. Partikel Melilit Naik Halus --- */
      for (let i = 0; i < swirlParticles.length; i++) {
        const sp = swirlParticles[i];
        sp.yProgress += sp.speedY;
        sp.angle += sp.rotSpeed;

        if (sp.yProgress > 1) {
          sp.yProgress = 0;
          sp.prevX = 0;
          sp.prevY = 0;
        }

        const py = cyBase - sp.yProgress * (cyBase - (cyHeart - 110));
        const r = sp.radius * (0.35 + Math.sin(sp.yProgress * Math.PI) * 1.5);
        const px = cx + Math.cos(sp.angle) * r;

        if (sp.prevX !== 0) {
          ctx.strokeStyle = sp.color;
          ctx.lineWidth = sp.size;
          ctx.beginPath();
          ctx.moveTo(sp.prevX, sp.prevY);
          ctx.lineTo(px, py);
          ctx.stroke();
        }

        sp.prevX = px;
        sp.prevY = py;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(px, py, sp.size * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }

      /* --- 3. Titik Bintang Volume Hati (Penuh & Rapat) --- */
      const beat = 1 + Math.sin(animTime * 2.8) * 0.025;

      for (let i = 0; i < heartParticles.length; i++) {
        const hp = heartParticles[i];
        hp.driftAngle += hp.driftSpeed;

        const ox = Math.cos(hp.driftAngle) * hp.driftRadius;
        const oy = Math.sin(hp.driftAngle) * hp.driftRadius;

        const tx = cx + (hp.baseX * beat) + ox + hp.scatterX;
        const ty = cyHeart + (hp.baseY * beat) + oy + hp.scatterY;

        hp.x += (tx - hp.x) * 0.09;
        hp.y += (ty - hp.y) * 0.09;

        hp.scatterX *= 0.92;
        hp.scatterY *= 0.92;

        ctx.fillStyle = hp.color;
        ctx.globalAlpha = hp.alpha;
        ctx.beginPath();
        ctx.arc(hp.x, hp.y, hp.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      /* --- 4. Partikel Ledakan saat Diketuk --- */
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;
        bp.vx *= 0.94;
        bp.vy *= 0.94;
        bp.size *= 0.95;

        ctx.fillStyle = bp.color;
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
        ctx.fill();

        if (bp.size < 0.2) burstParticles.splice(i, 1);
      }

      requestAnimationFrame(render);
    }
    render();

    setInterval(() => {
      if (audioCtx) playSwirlSound();
    }, 4500);

    /* ========================================================
       4. INTERAKSI KETUK (LEDAKAN PECAH & MENYATU LAGI)
       ======================================================== */
    window.addEventListener('pointerdown', () => {
      playBassExplosion();

      const cx = width / 2;
      const cyHeart = height / 2 - 35;

      // Hamburan partikel percikan
      for (let i = 0; i < 180; i++) {
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 16 + 5;
        burstParticles.push({
          x: cx,
          y: cyHeart,
          vx: Math.cos(angle) * force,
          vy: Math.sin(angle) * force,
          size: Math.random() * 3.2 + 1.2,
          color: BLUE_PALETTE[Math.floor(Math.random() * BLUE_PALETTE.length)]
        });
      }

      // Hati meledak terpental luas lalu ditarik kembali secara utuh
      for (let i = 0; i < heartParticles.length; i++) {
        const hp = heartParticles[i];
        const angle = Math.atan2(hp.y - cyHeart, hp.x - cx) + (Math.random() - 0.5) * 0.4;
        const force = Math.random() * 250 + 100;
        hp.scatterX = Math.cos(angle) * force;
        hp.scatterY = Math.sin(angle) * force;
      }
    });
  </script>
</body>
</html>
