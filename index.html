<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electric Particle Heart 3D with Cinematic Audio</title>
  <meta name="description" content="3D Glowing Particle Heart with Electric Cyan Energy Pool, Vortex Surge, and Cinematic Sound FX" />
  
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    /* Floating UI Overlay */
    .ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      z-index: 10;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: auto;
    }

    .badge-status {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 212, 255, 0.25);
      padding: 8px 18px;
      border-radius: 9999px;
      backdrop-filter: blur(10px);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00d4ff;
      box-shadow: 0 0 10px #00d4ff;
    }

    .status-text {
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #a0f0ff;
    }

    .action-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .btn-surge {
      background: linear-gradient(135deg, #00d4ff 0%, #0059ff 100%);
      color: #000000;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 30px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
      transition: all 0.25s ease;
    }

    .btn-surge:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(0, 212, 255, 0.8);
    }

    .btn-surge:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .tip {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-family: monospace;
      text-align: center;
    }

    .btn-icon {
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .btn-icon.active {
      border-color: #00d4ff;
      color: #00d4ff;
      background: rgba(0, 50, 80, 0.7);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    }

    .btn-icon:hover {
      border-color: #00d4ff;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer" id="ui-layer">
    <div class="top-bar">
      <div class="badge-status">
        <div class="dot" id="status-dot"></div>
        <span class="status-text" id="status-text">Pulsing Heart • 45,000 Particles</span>
      </div>

      <button class="btn-icon" id="btn-audio" title="Klik untuk mengaktifkan Suara Sinematik">
        <span>🔊</span>
        <span id="audio-label">Sound: OFF</span>
      </button>
    </div>

    <div class="action-bar">
      <button class="btn-surge" id="btn-surge">
        ⚡ Trigger Vortex Surge
      </button>
      <div class="tip">Geser mouse/layar untuk rotasi 3D • Scroll untuk zoom • Tekan Spasi untuk Vortex</div>
    </div>
  </div>

  <script>
    // --- 1. Cinematic Web Audio Procedural Synthesizer ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
        this.ambientGain = null;
        this.ambientOscs = [];
      }

      initCtx() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
        return this.ctx;
      }

      toggle() {
        this.enabled = !this.enabled;
        const btn = document.getElementById('btn-audio');
        const label = document.getElementById('audio-label');
        if (this.enabled) {
          this.initCtx();
          this.startAmbient();
          this.playHeartbeat();
          btn.classList.add('active');
          label.innerText = 'Sound: ON';
        } else {
          this.stopAmbient();
          btn.classList.remove('active');
          label.innerText = 'Sound: OFF';
        }
      }

      // Detak Jantung Ganda Realistis (Lub-Dub)
      playHeartbeat() {
        if (!this.enabled) return;
        const ctx = this.initCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        // Lub (pertama, dalam dan hangat)
        this.thump(now, 58, 30, 0.22, 0.45);
        // Dub (kedua, sedikit lebih tinggi)
        this.thump(now + 0.16, 68, 34, 0.18, 0.32);
      }

      thump(time, startFreq, endFreq, dur, vol) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(startFreq, time);
        osc.frequency.exponentialRampToValueAtTime(endFreq, time + dur);

        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);

        // Lowpass resonance
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(140, time);
        filter.frequency.exponentialRampToValueAtTime(50, time + dur);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(time);
        osc.stop(time + dur);
      }

      // Efek Suara Pusaran Listrik (Vortex Surge)
      playVortexSurge() {
        if (!this.enabled) return;
        const ctx = this.initCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const duration = 4.2;

        // 1. Sub-bass riser
        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sine';
        subOsc.frequency.setValueAtTime(42, now);
        subOsc.frequency.exponentialRampToValueAtTime(95, now + 1.2);
        subOsc.frequency.exponentialRampToValueAtTime(160, now + 2.4);
        subOsc.frequency.exponentialRampToValueAtTime(40, now + duration);

        subGain.gain.setValueAtTime(0.001, now);
        subGain.gain.linearRampToValueAtTime(0.38, now + 1.2);
        subGain.gain.linearRampToValueAtTime(0.35, now + 2.8);
        subGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start(now);
        subOsc.stop(now + duration);

        // 2. Swirling Cosmic Air Rush
        const bufferSize = ctx.sampleRate * 3.5;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          data[i] = (b0 + b1 + b2) * 0.4;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 5.5;
        filter.frequency.setValueAtTime(200, now);
        filter.frequency.exponentialRampToValueAtTime(1600, now + 1.6);
        filter.frequency.exponentialRampToValueAtTime(2400, now + 2.4);
        filter.frequency.exponentialRampToValueAtTime(280, now + 3.5);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.001, now);
        noiseGain.gain.linearRampToValueAtTime(0.28, now + 1.4);
        noiseGain.gain.linearRampToValueAtTime(0.25, now + 2.4);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 3.5);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 3.5);

        // 3. Stardust Crystal Chimes
        const freqs = [528, 660, 792, 1056, 1320, 1584];
        freqs.forEach((freq, idx) => {
          const chimeTime = now + 0.5 + idx * 0.35;
          const chimeOsc = ctx.createOscillator();
          const chimeGain = ctx.createGain();

          chimeOsc.type = 'sine';
          chimeOsc.frequency.setValueAtTime(freq, chimeTime);
          chimeOsc.frequency.exponentialRampToValueAtTime(freq * 1.5, chimeTime + 0.6);

          chimeGain.gain.setValueAtTime(0.001, chimeTime);
          chimeGain.gain.linearRampToValueAtTime(0.04, chimeTime + 0.05);
          chimeGain.gain.exponentialRampToValueAtTime(0.0001, chimeTime + 0.6);

          chimeOsc.connect(chimeGain);
          chimeGain.connect(ctx.destination);
          chimeOsc.start(chimeTime);
          chimeOsc.stop(chimeTime + 0.6);
        });

        // 4. Reform Chime
        setTimeout(() => {
          if (this.enabled && this.ctx) this.playReformChime();
        }, 3600);
      }

      playReformChime() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        [432, 540, 648].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 1.8);
        });
      }

      // Background Ambient Drone (432Hz Chord)
      startAmbient() {
        if (!this.ctx) return;
        this.ambientGain = this.ctx.createGain();
        this.ambientGain.gain.setValueAtTime(0.001, this.ctx.currentTime);
        this.ambientGain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 2.0);
        this.ambientGain.connect(this.ctx.destination);

        const baseFreqs = [108, 216, 324];
        this.ambientOscs = baseFreqs.map((freq, i) => {
          const osc = this.ctx.createOscillator();
          osc.type = i === 0 ? 'sine' : 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          const lfo = this.ctx.createOscillator();
          const lfoGain = this.ctx.createGain();
          lfo.frequency.value = 0.15 + i * 0.08;
          lfoGain.gain.value = 1.2;
          lfo.connect(osc.frequency);
          lfo.start();

          osc.connect(this.ambientGain);
          osc.start();
          return osc;
        });
      }

      stopAmbient() {
        if (this.ambientGain && this.ctx) {
          this.ambientGain.gain.linearRampToValueAtTime(0.0001, this.ctx.currentTime + 0.8);
          setTimeout(() => {
            this.ambientOscs.forEach(o => { try { o.stop(); o.disconnect(); } catch(e){} });
            this.ambientOscs = [];
          }, 900);
        }
      }
    }

    const sound = new SoundEngine();
    document.getElementById('btn-audio').addEventListener('click', () => sound.toggle());

    // --- 2. Three.js Scene Setup & Geometry ---
    function getHeartPoint(t) {
      const sinT = Math.sin(t);
      const cosT = Math.cos(t);
      const x = 16 * Math.pow(sinT, 3);
      const y = 13 * cosT - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return [x, y];
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 38);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 1);
    container.appendChild(renderer.domElement);

    // --- 45,000 Heart Particles ---
    const PARTICLE_COUNT = 45000;
    const scale = 0.60;
    const yCenterOffset = 2.4;

    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);
    const phases = new Float32Array(PARTICLE_COUNT);
    const vortexFactors = new Float32Array(PARTICLE_COUNT * 3);

    const primaryCol = new THREE.Color('#00d4ff');     // Electric cyan
    const secondaryCol = new THREE.Color('#0a389c');   // Deep sapphire blue
    const deepMidnight = new THREE.Color('#031849');   // Midnight blue
    const coreCol = new THREE.Color('#ffffff');        // Diamond sparkle

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i * 3;
      const t = Math.random() * Math.PI * 2;
      const [rawX, rawY] = getHeartPoint(t);

      const randType = Math.random();
      let r, isShell = false;
      if (randType < 0.62) {
        r = 0.88 + Math.pow(Math.random(), 3.0) * 0.14;
        isShell = true;
      } else if (randType < 0.94) {
        r = Math.pow(Math.random(), 0.7) * 0.88;
      } else {
        r = 1.02 + Math.random() * 0.16;
      }

      const x2D = rawX * r * scale;
      const y2D = (rawY * r + yCenterOffset) * scale;
      const normH = Math.max(0, Math.min(1, (rawY + 17) / 33.5));
      const maxThickness = Math.pow(Math.sin(normH * Math.PI), 0.7) * 7.5 * scale;
      const radialRatio = Math.min(1, r);
      const zSpan = Math.sqrt(Math.max(0.01, 1 - radialRatio * radialRatio)) * maxThickness;

      let z = isShell 
        ? (Math.random() > 0.5 ? 1 : -1) * zSpan * 0.9 + (Math.random() - 0.5) * 0.3
        : (Math.random() * 2 - 1) * (zSpan * 0.9 + 0.1);

      positions[i3] = x2D;
      positions[i3 + 1] = y2D;
      positions[i3 + 2] = z;

      const pCol = new THREE.Color();
      const whiteChance = Math.random();
      if (whiteChance < 0.12) {
        pCol.copy(coreCol);
        sizes[i] = 1.8 + Math.random() * 1.5;
      } else if (whiteChance < 0.32) {
        pCol.lerpColors(primaryCol, coreCol, 0.25);
        sizes[i] = 1.2 + Math.random() * 1.2;
      } else if (isShell) {
        pCol.lerpColors(secondaryCol, primaryCol, Math.random() * 0.7);
        sizes[i] = 1.0 + Math.random() * 1.2;
      } else {
        pCol.lerpColors(secondaryCol, deepMidnight, Math.random() * 0.6);
        sizes[i] = 0.9 + Math.random() * 1.0;
      }

      colors[i3] = pCol.r;
      colors[i3 + 1] = pCol.g;
      colors[i3 + 2] = pCol.b;

      phases[i] = Math.random() * Math.PI * 2;

      const distFromCenter = Math.sqrt(x2D * x2D + z * z);
      const centerFactor = Math.max(0, 1.0 - distFromCenter / 7.0);
      const heightVuln = (1.0 - normH);
      const vulnerability = Math.min(1.0, heightVuln * 0.7 + centerFactor * 0.6);

      vortexFactors[i3] = vulnerability;
      vortexFactors[i3 + 1] = 0.7 + Math.random() * 0.6;
      vortexFactors[i3 + 2] = Math.random() > 0.5 ? 1 : -1;
    }

    const heartGeo = new THREE.BufferGeometry();
    heartGeo.setAttribute('position', new THREE.BufferAttribute(positions.slice(), 3));
    heartGeo.setAttribute('basePosition', new THREE.BufferAttribute(positions, 3));
    heartGeo.setAttribute('pColor', new THREE.BufferAttribute(colors, 3));
    heartGeo.setAttribute('pSize', new THREE.BufferAttribute(sizes, 1));
    heartGeo.setAttribute('pPhase', new THREE.BufferAttribute(phases, 1));
    heartGeo.setAttribute('pVortexFactor', new THREE.BufferAttribute(vortexFactors, 3));

    const heartUniforms = {
      uTime: { value: 0 },
      uSurgeProgress: { value: 0 },
      uHeartbeat: { value: 0 },
      uBloomIntensity: { value: 0.9 },
      uPrimaryColor: { value: primaryCol }
    };

    const heartMat = new THREE.ShaderMaterial({
      vertexShader: `
        attribute vec3 basePosition;
        attribute vec3 pColor;
        attribute float pSize;
        attribute float pPhase;
        attribute vec3 pVortexFactor;

        uniform float uTime;
        uniform float uSurgeProgress;
        uniform float uHeartbeat;
        uniform float uBloomIntensity;
        uniform vec3 uPrimaryColor;

        varying vec3 vColor;
        varying float vAlpha;
        varying float vTwinkle;

        void main() {
          vec3 pos = basePosition;

          // Heartbeat pulse
          vec3 centerOffset = pos - vec3(0.0, 2.0, 0.0);
          pos += normalize(centerOffset) * uHeartbeat * 0.7;

          // Shimmer
          pos.x += sin(uTime * 2.0 + pPhase) * 0.07;
          pos.y += cos(uTime * 1.6 + pPhase) * 0.05;
          pos.z += sin(uTime * 2.2 + pPhase) * 0.07;

          // Vortex Surge
          float vuln = pVortexFactor.x;
          if (uSurgeProgress > 0.001 && vuln > 0.05) {
            float surgePower = sin(uSurgeProgress * 3.14159265);
            float localPower = pow(surgePower, 1.2) * vuln;

            pos.y += localPower * 20.0 * pVortexFactor.y;

            float swirlAngle = (localPower * 9.0 + uTime * 3.5) * pVortexFactor.z;
            float curRadius = length(pos.xz);
            float newRadius = curRadius * (1.0 + localPower * 0.8) + localPower * 1.8;
            float totalAngle = atan(pos.z, pos.x) + swirlAngle;

            pos.x = cos(totalAngle) * newRadius;
            pos.z = sin(totalAngle) * newRadius;

            pos.x += sin(uTime * 28.0 + pos.y * 2.0) * localPower * 0.6;
            pos.z += cos(uTime * 25.0 + pos.y * 2.0) * localPower * 0.6;
          }

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;

          float basePointSize = pSize * (200.0 / -mvPosition.z);
          float surgeBoost = 1.0 + sin(uSurgeProgress * 3.14159265) * 0.6 * vuln;
          gl_PointSize = clamp(basePointSize * (1.0 + uHeartbeat * 0.2) * surgeBoost, 1.0, 14.0);

          vTwinkle = sin(uTime * 3.2 + pPhase * 2.5) * 0.5 + 0.5;

          vec3 finalCol = pColor;
          if (uSurgeProgress > 0.001) {
            float surgeGlow = sin(uSurgeProgress * 3.14159265) * vuln;
            finalCol = mix(finalCol, uPrimaryColor, surgeGlow * 0.75);
          }
          vColor = finalCol;
          vAlpha = clamp(0.7 + vTwinkle * 0.3, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        varying float vTwinkle;
        uniform float uBloomIntensity;

        void main() {
          vec2 coord = gl_PointCoord - vec2(0.5);
          float dist = length(coord);
          if (dist > 0.5) discard;

          float core = smoothstep(0.18, 0.0, dist);
          float halo = exp(-dist * 12.0);

          float lightEnergy = (core * 2.2 + halo * 0.8) * uBloomIntensity;
          vec3 outColor = mix(vColor, vec3(1.0), core * 0.85);
          gl_FragColor = vec4(outColor * lightEnergy, halo * vAlpha);
        }
      `,
      uniforms: heartUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const heartPoints = new THREE.Points(heartGeo, heartMat);
    scene.add(heartPoints);

    // --- Energy Puddle ---
    const poolGeo = new THREE.PlaneGeometry(16, 16, 32, 32);
    poolGeo.rotateX(-Math.PI / 2);

    const poolUniforms = {
      uTime: { value: 0 },
      uSurgeProgress: { value: 0 },
      uHeartbeat: { value: 0 }
    };

    const poolMat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        uniform float uTime;
        uniform float uSurgeProgress;
        uniform float uHeartbeat;

        void main() {
          vec2 p = vUv - vec2(0.5);
          p.y *= 2.5;
          float d = length(p);
          if (d > 0.5) discard;

          float angle = atan(p.y, p.x);
          float swirl = sin(d * 28.0 - uTime * 4.0 + angle * 3.0);
          float brightCore = smoothstep(0.2, 0.0, d);
          float midGlow = exp(-d * 6.0);
          float outerHalo = exp(-d * 3.5);

          float surgeFlare = sin(uSurgeProgress * 3.14159265) * 1.5;
          float energy = (brightCore * 3.2 + midGlow * 2.0 + outerHalo * 0.8 + swirl * 0.25 * midGlow) * (1.0 + surgeFlare + uHeartbeat * 0.3);

          vec3 col = mix(vec3(0.0, 0.9, 1.0), vec3(0.0, 0.4, 0.9), d * 1.8);
          col = mix(col, vec3(1.0), brightCore * 0.9);

          gl_FragColor = vec4(col * energy, clamp((midGlow * 1.4 + brightCore) * (1.0 - d * 2.0), 0.0, 1.0));
        }
      `,
      uniforms: poolUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    });

    const poolMesh = new THREE.Mesh(poolGeo, poolMat);
    poolMesh.position.set(0, -11.6, 0);
    scene.add(poolMesh);

    // --- 26 Tendril Ribbons ---
    const numTendrils = 26;
    const pointsPerTendril = 64;
    const tendrilLines = [];
    const tendrilConfigs = [];

    for (let t = 0; t < numTendrils; t++) {
      const baseAngle = (t / numTendrils) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
      const speed = 4.0 + Math.random() * 3.5;
      const radiusScale = 0.5 + Math.random() * 0.8;
      const heightOffset = (Math.random() - 0.5) * 4.0;
      const swirlTension = 1.2 + Math.random() * 1.5;

      const pts = [];
      const cols = [];
      for (let p = 0; p < pointsPerTendril; p++) {
        pts.push(new THREE.Vector3(0, -15, 0));
        const pNorm = p / (pointsPerTendril - 1);
        const c = new THREE.Color();
        if (pNorm > 0.8) c.lerpColors(primaryCol, coreCol, (pNorm - 0.8) / 0.2);
        else if (pNorm > 0.35) c.copy(primaryCol);
        else c.lerpColors(secondaryCol, primaryCol, pNorm / 0.35);
        cols.push(c.r, c.g, c.b);
      }

      const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
      lineGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
      const lineMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        linewidth: 2
      });

      const line = new THREE.Line(lineGeo, lineMat);
      scene.add(line);
      tendrilLines.push(line);
      tendrilConfigs.push({ baseAngle, speed, radiusScale, heightOffset, swirlTension });
    }

    // --- 3. Animation State & Loop ---
    const state = {
      phase: 'idle',
      phaseTime: 0,
      cycleTimer: 0,
      surgeProgress: 0,
      rotation: { x: 0.05, y: 0, targetX: 0.05, targetY: 0 },
      isDragging: false,
      dragStart: { x: 0, y: 0 },
      zoom: 38
    };

    function triggerVortex() {
      if (state.phase === 'vortex') return;
      state.phase = 'vortex';
      state.phaseTime = 0;
      sound.playVortexSurge();
      document.getElementById('btn-surge').disabled = true;
      document.getElementById('status-text').innerText = 'Vortex Surging...';
    }

    document.getElementById('btn-surge').addEventListener('click', triggerVortex);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        triggerVortex();
      }
    });

    // Mouse / Touch Drag
    window.addEventListener('mousedown', (e) => {
      state.isDragging = true;
      state.dragStart = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', (e) => {
      if (!state.isDragging) return;
      const dx = e.clientX - state.dragStart.x;
      const dy = e.clientY - state.dragStart.y;
      state.rotation.targetY += dx * 0.008;
      state.rotation.targetX = Math.max(-0.6, Math.min(0.6, state.rotation.targetX + dy * 0.006));
      state.dragStart = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mouseup', () => state.isDragging = false);
    window.addEventListener('wheel', (e) => {
      state.zoom = Math.max(22, Math.min(55, state.zoom + e.deltaY * 0.03));
    });

    window.addEventListener('touchstart', (e) => {
      state.isDragging = true;
      state.dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    window.addEventListener('touchmove', (e) => {
      if (!state.isDragging) return;
      const dx = e.touches[0].clientX - state.dragStart.x;
      const dy = e.touches[0].clientY - state.dragStart.y;
      state.rotation.targetY += dx * 0.008;
      state.rotation.targetX = Math.max(-0.6, Math.min(0.6, state.rotation.targetX + dy * 0.006));
      state.dragStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });
    window.addEventListener('touchend', () => state.isDragging = false);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    let lastBeat = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      state.phaseTime += delta;
      state.cycleTimer += delta;

      // Auto cycle setiap 11s
      if (state.cycleTimer >= 11.0) {
        state.cycleTimer = 0;
        triggerVortex();
      }

      if (state.phase === 'vortex') {
        const dur = 4.2;
        state.surgeProgress = Math.min(1.0, state.phaseTime / dur);
        if (state.surgeProgress >= 1.0) {
          state.phase = 'reforming';
          state.phaseTime = 0;
        }
      } else if (state.phase === 'reforming') {
        const dur = 2.0;
        state.surgeProgress = 1.0 - Math.min(1.0, state.phaseTime / dur);
        if (state.surgeProgress <= 0.0) {
          state.phase = 'idle';
          state.phaseTime = 0;
          state.surgeProgress = 0;
          document.getElementById('btn-surge').disabled = false;
          document.getElementById('status-text').innerText = 'Pulsing Heart • 45,000 Particles';
        }
      }

      // Heartbeat pulse
      const beatCycle = (elapsed * 0.9) % 1.0;
      let beat = 0;
      if (beatCycle < 0.12) beat = Math.sin((beatCycle / 0.12) * Math.PI) * 0.085;
      else if (beatCycle > 0.18 && beatCycle < 0.32) beat = Math.sin(((beatCycle - 0.18) / 0.14) * Math.PI) * 0.055;

      if (beatCycle < 0.04 && elapsed - lastBeat > 0.7) {
        lastBeat = elapsed;
        sound.playHeartbeat();
      }

      heartUniforms.uTime.value = elapsed;
      heartUniforms.uSurgeProgress.value = state.surgeProgress;
      heartUniforms.uHeartbeat.value = beat;

      poolUniforms.uTime.value = elapsed;
      poolUniforms.uSurgeProgress.value = state.surgeProgress;
      poolUniforms.uHeartbeat.value = beat;

      // Animate tendrils
      const surgeVal = state.surgeProgress;
      const tendrilOp = Math.pow(Math.sin(surgeVal * Math.PI), 1.3);

      for (let t = 0; t < numTendrils; t++) {
        const line = tendrilLines[t];
        const cfg = tendrilConfigs[t];
        line.material.opacity = tendrilOp;

        if (surgeVal > 0.005) {
          const posArr = line.geometry.attributes.position.array;
          const rotSpeed = cfg.speed * elapsed * 2.6;
          const climb = Math.min(1.0, surgeVal * 1.5);

          for (let p = 0; p < pointsPerTendril; p++) {
            const pNorm = p / (pointsPerTendril - 1);
            const targetY = -11.6 + pNorm * climb * (23.5 + cfg.heightOffset);
            const radius = (Math.sin(pNorm * Math.PI) * 5.4 + 0.9) * cfg.radiusScale;
            const angle = cfg.baseAngle + rotSpeed + pNorm * (8.5 * cfg.swirlTension);

            const p3 = p * 3;
            posArr[p3] = Math.cos(angle) * radius + Math.sin(elapsed * 28.0 + p) * 0.15 * surgeVal;
            posArr[p3 + 1] = targetY;
            posArr[p3 + 2] = Math.sin(angle) * radius + Math.cos(elapsed * 25.0 + p) * 0.15 * surgeVal;
          }
          line.geometry.attributes.position.needsUpdate = true;
        }
      }

      // Smooth camera rotation
      state.rotation.x += (state.rotation.targetX - state.rotation.x) * 0.08;
      state.rotation.y += (state.rotation.targetY - state.rotation.y) * 0.08;

      heartPoints.rotation.y = state.rotation.y;
      heartPoints.rotation.x = state.rotation.x;
      poolMesh.rotation.y = state.rotation.y * 0.5;

      camera.position.z += (state.zoom - camera.position.z) * 0.08;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
